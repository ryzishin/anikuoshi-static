<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a07">
<meta name="description" content="AniKuoshi v1.0.8 — a clean, fast way to watch anime. Search, discover, and stream.">
<meta name="version" content="1.0.8">
<title>AniKuoshi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0a07'/%3E%3Cpath d='M25 19l22 13-22 13z' fill='%23f5a524'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<style>
/* ============ AniKuoshi v1.0.8 design system — espresso black / amber ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0c0a07; --bg2:#14100b; --bg3:#1c1610; --bg4:#241c13;
  --line:#2a2216; --line2:#3b3020;
  --txt:#f4efe5; --dim:#b0a692; --faint:#7d7362;
  --acc:#f5a524; --acc2:#ffc25c; --accsoft:rgba(245,165,36,.13);
  --ok:#4cc38a; --err:#e5484d; --dub:#7fc0ff;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --hd-h:56px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --shadow-soft:0 6px 18px rgba(0,0,0,.32);
  --shadow-acc:0 8px 24px rgba(245,165,36,.18);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s var(--ease)}
::selection{background:rgba(245,165,36,.32)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;transition:color .15s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
/* Mouse/touch input should NEVER produce a focus ring, even on tabindex=0
   elements (which browsers heuristically mark as :focus-visible on click).
   The .no-focus-ring class is toggled on <html> by InputModality.js below
   whenever the last input was a pointer event, and removed on keydown.     */
html.no-focus-ring :focus,
html.no-focus-ring :focus-visible,
html.no-focus-ring button:focus,
html.no-focus-ring button:focus-visible,
html.no-focus-ring a:focus,
html.no-focus-ring a:focus-visible,
html.no-focus-ring [tabindex]:focus,
html.no-focus-ring [tabindex]:focus-visible,
html.no-focus-ring .hcard:focus,
html.no-focus-ring .hcard:focus-visible,
html.no-focus-ring .ep-card-sm:focus,
html.no-focus-ring .ep-card-sm:focus-visible,
html.no-focus-ring .histrow:focus,
html.no-focus-ring .histrow:focus-visible,
html.no-focus-ring .worow:focus,
html.no-focus-ring .worow:focus-visible,
html.no-focus-ring .sugg-item:focus,
html.no-focus-ring .sugg-item:focus-visible{outline:none}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2417;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3b3020}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:#2c2417 transparent}

/* ---------- shell ---------- */
.hd{position:sticky;top:0;z-index:50;background:rgba(12,10,7,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);transition:border-color .2s var(--ease),background .2s var(--ease)}
.hd-in{max-width:1160px;margin:0 auto;height:var(--hd-h);display:flex;align-items:center;gap:6px;padding:0 10px}
.hd-sp{flex:1;min-width:0}
.hd-title{font-size:15px;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--dim);flex:none;transition:color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
.hd-btn:hover{color:var(--txt);background:var(--bg3)}
.hd-btn:active{transform:scale(.92);background:var(--bg4)}
.hd-btn.star-on{color:var(--acc)}
.brand{display:flex;align-items:center;gap:9px;padding:6px 4px;user-select:none;cursor:pointer}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,#241c13,#171209);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;color:var(--acc);transition:transform .25s var(--ease-spring),box-shadow .25s var(--ease)}
.brand:hover .brand-mark{transform:rotate(-6deg) scale(1.06);box-shadow:var(--shadow-acc)}
.brand-name{font-weight:750;font-size:17px;letter-spacing:.02em}
.brand-name b{color:var(--acc);font-weight:750}
.hd-ver{font-size:10px;font-weight:700;color:var(--acc);background:var(--accsoft);border:1px solid rgba(245,165,36,.35);
  padding:2px 6px;border-radius:6px;letter-spacing:.05em;cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease)}
.hd-ver:hover{background:rgba(245,165,36,.22);border-color:rgba(245,165,36,.55)}
.wrap{max-width:1160px;margin:0 auto;padding:0 14px}
.view{min-height:calc(100dvh - var(--hd-h));outline:none;padding-bottom:env(safe-area-inset-bottom)}
.foot{padding:34px 0 42px;text-align:center;color:var(--faint);font-size:12px;letter-spacing:.04em}
.foot a{color:var(--dim);transition:color .15s var(--ease)}
.foot a:hover{color:var(--acc)}
.foot-ver{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
.foot-ver .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}

/* ---------- loader: wiggling ellipsis ---------- */
.dots{display:inline-flex;align-items:flex-end;gap:6px;height:22px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:dwig 1.15s var(--ease) infinite;transform-origin:center bottom}
.dots i:nth-child(2){animation-delay:.13s;background:#d98f1c}
.dots i:nth-child(3){animation-delay:.26s;background:#b57714}
@keyframes dwig{0%,60%,100%{transform:translateY(0) scale(1);opacity:.55}30%{transform:translateY(-9px) scale(1.12);opacity:1}}
.dots--lg i{width:11px;height:11px}
.dots--lg{height:30px;gap:9px}
.loadbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 20px;color:var(--faint);font-size:13.5px;letter-spacing:.03em}
.load-inline{display:inline-flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:10px 0}

/* ---------- skeletons ---------- */
.skel{position:relative;overflow:hidden;background:var(--bg3);border-radius:var(--r-m)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);animation:sksh 1.4s infinite}
@keyframes sksh{100%{transform:translateX(100%)}}
.skel-hero{height:210px;border-radius:0}
.skel-line{height:14px;margin:10px 0;border-radius:6px}
.skel-line.w60{width:60%}.skel-line.w85{width:85%}.skel-line.w40{width:40%}
.skel-poster{aspect-ratio:2/3}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border-radius:13px;
  font-weight:650;font-size:14.5px;letter-spacing:.01em;user-select:none;transition:transform .12s var(--ease),background .18s var(--ease),border-color .18s var(--ease),box-shadow .2s var(--ease)}
.btn:active{transform:scale(.975)}
.btn--acc{background:var(--acc);color:#20180a;box-shadow:var(--shadow-acc)}
.btn--acc:hover{background:var(--acc2);box-shadow:0 10px 28px rgba(245,165,36,.28)}
.btn--line{border:1px solid var(--line2);background:var(--bg3);color:var(--txt)}
.btn--line:hover{border-color:#4d3f28;background:var(--bg4)}
.btn--ghost{color:var(--dim)}
.btn--ghost:hover{color:var(--txt);background:var(--bg3)}
.btn--lg{min-height:52px;padding:0 24px;font-size:15.5px;border-radius:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icbtn{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border-radius:13px;color:var(--dim);flex:none;transition:color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
.icbtn:hover{color:var(--txt);background:var(--bg3)}
.icbtn:active{transform:scale(.94)}
.icbtn.on{color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);
  background:var(--bg3);color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap;transition:all .15s var(--ease)}
.chip:hover{color:var(--txt);border-color:#4d3f28}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accsoft);border-color:rgba(245,165,36,.55);color:var(--acc)}
.chip--dub.on{background:rgba(127,192,255,.12);border-color:rgba(127,192,255,.45);color:var(--dub)}
.chip[disabled]{opacity:.38;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--bg4);color:var(--dim)}
.badge--acc{background:var(--accsoft);color:var(--acc)}
.badge--dub{background:rgba(127,192,255,.12);color:var(--dub)}
.badge--fill{background:rgba(229,72,77,.14);color:#ff8589}
.badge--ok{background:rgba(76,195,138,.14);color:var(--ok)}
.badge--here{background:var(--acc);color:#20180a;box-shadow:0 2px 8px rgba(245,165,36,.4)}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:9dvh 18px 20px;gap:26px;position:relative;z-index:80}
.hero-brand{display:flex;flex-direction:column;align-items:center;gap:14px}
.hero-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,#241c13,#151007);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;color:var(--acc);box-shadow:var(--shadow);animation:floatMark 3.5s var(--ease) infinite}
@keyframes floatMark{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero-mark svg.ic{width:30px;height:30px;stroke-width:1.6}
.hero h1{margin:0;font-size:34px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.hero h1 b{color:var(--acc);font-weight:800}
.hero p{margin:0;color:var(--faint);font-size:14px;letter-spacing:.02em}
.searchwrap{width:100%;max-width:560px;position:relative;z-index:80}
.searchbar{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;
  padding:5px 6px 5px 16px;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.searchbar:focus-within{border-color:rgba(245,165,36,.6);box-shadow:0 0 0 3px rgba(245,165,36,.12)}
.searchbar>svg.ic{color:var(--faint);flex:none}
.searchbar input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font-size:16px;padding:12px 4px;letter-spacing:.01em}
.searchbar input::placeholder{color:var(--faint)}
.searchbar .icbtn{width:42px;height:42px;border-radius:12px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--bg2);border:1px solid var(--line2);border-radius:16px;
  box-shadow:var(--shadow);overflow-y:auto;overflow-x:hidden;
  /* The JS sets --sugg-avail on open so the overlay never spills past the
     viewport bottom — it shrinks to whatever vertical room is left.         */
  max-height:var(--sugg-avail, min(72dvh, 460px));
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  z-index:100;display:none;animation:suggPop .2s var(--ease-out)}
@keyframes suggPop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.sugg.open{display:block}
.sugg-item{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s var(--ease)}
.sugg-item:last-child{border-bottom:0}
.sugg-item:active,.sugg-item[data-active]{background:var(--bg4)}
.sugg-thumb{width:40px;height:56px;border-radius:8px;object-fit:cover;background:var(--bg4);flex:none}
.sugg-thumb-fallback{width:40px;height:56px;border-radius:8px;background:var(--bg4);flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.sugg-info{min-width:0;flex:1}
.sugg-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg-meta{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg-empty{padding:20px 16px;color:var(--faint);font-size:13.5px;text-align:center}
.sugg-note{padding:8px 16px 12px;color:var(--faint);font-size:11.5px;letter-spacing:.03em;text-align:center}
/* hide keyboard hint on touch devices (no arrow keys / Esc there) and on
   small screens (overlay real estate is too precious to waste on the hint) */
@media(hover:none){.sugg-note{display:none}}
@media(max-width:520px){.sugg-note{display:none}}
@media(max-width:520px){
  .sugg{border-radius:14px}
  .sugg-item{padding:11px 12px;gap:11px}
  .sugg-thumb,.sugg-thumb-fallback{width:36px;height:50px;border-radius:7px}
  .sugg-title{font-size:13.5px}
  .sugg-meta{font-size:11.5px}
}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
</style>
<style>
/* ---------- shelves & cards ---------- */
.shelf{margin:26px 0}
.shelf-hd{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.shelf-hd h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.01em}
.shelf-hd .sub{color:var(--faint);font-size:12.5px;margin-left:auto}
.shelf-hd .icbtn{width:38px;height:38px;border-radius:11px}
.shelf-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelf-row::-webkit-scrollbar{display:none}
.hcard{width:128px;flex:none;scroll-snap-align:start;cursor:pointer;transition:transform .2s var(--ease)}
.hcard:active{transform:scale(.97)}
.hcard .hposter{width:128px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--bg3);border:1px solid var(--line);position:relative;transition:border-color .18s var(--ease),box-shadow .2s var(--ease)}
.hcard:hover .hposter{border-color:var(--line2);box-shadow:var(--shadow-soft)}
.hcard img{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease)}
.hcard:hover img{transform:scale(1.05)}
.hcard .hcard-title{margin-top:8px;font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;word-break:break-word;
  /* v1.0.3: Fixed 2-line height so every card aligns regardless of title length. */
  height:calc(1.35em * 2);min-height:0}
.hcard .hcard-meta{margin-top:3px;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  /* v1.0.3: Always reserve 1 line so meta presence doesn't shift the grid */
  height:1.4em}
.hcard .hcard-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55)}
.hcard .hcard-prog i{display:block;height:100%;background:var(--acc)}
.epchip{position:absolute;top:6px;left:6px;background:rgba(10,8,5,.82);color:var(--txt);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.05em}
.imph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#57503f;background:var(--bg3)}
.hcard.relcard{width:150px}
.hcard.relcard .hposter{width:150px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:16px 0}
.grid .hcard{width:auto}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 0 10px}
.pager span{color:var(--faint);font-size:13px;min-width:64px;text-align:center}

/* ---------- empty / error states ---------- */
.statebox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:56px 24px;color:var(--faint)}
.statebox svg.ic{width:38px;height:38px;stroke-width:1.4;color:#57503f}
.statebox h3{margin:2px 0 0;font-size:16px;color:var(--txt);font-weight:700}
.statebox p{margin:0;font-size:13.5px;max-width:340px}
.statebox .btn{margin-top:8px}
.offline-bar{display:none;align-items:center;gap:12px;justify-content:center;padding:10px 14px;margin:14px 0 0;border:1px solid rgba(229,72,77,.35);background:rgba(229,72,77,.07);border-radius:14px;color:#ff9d9f;font-size:13px}
.offline-bar.show{display:flex}

/* ---------- details ---------- */
.dhero{position:relative;min-height:216px;background:var(--bg2);overflow:hidden}
.dhero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;transition:transform 1.5s var(--ease)}
.dhero:hover .dhero-img{transform:scale(1.04)}
.dhero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,7,.25) 0%,rgba(12,10,7,.72) 62%,var(--bg) 100%)}
.dbody{position:relative;margin-top:-96px;padding:0 14px}
.dhead{display:flex;gap:14px;align-items:flex-end}
.dposter{width:112px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;flex:none;background:var(--bg3);
  border:1px solid var(--line2);box-shadow:var(--shadow);position:relative}
.dposter img{width:100%;height:100%;object-fit:cover}
.dinfo{min-width:0;padding-bottom:2px;flex:1}
.dtype-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.dtitle{margin:0;font-size:21px;font-weight:800;line-height:1.22;letter-spacing:.005em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.dsub{margin:5px 0 0;color:var(--dim);font-size:13px;min-width:0}
.dchips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
.dcta{display:flex;gap:9px;align-items:center;margin:18px 0 4px;flex-wrap:wrap}
.dcta .btn{flex:1;min-width:170px}
.dcta .icbtn{border:1px solid var(--line2);background:var(--bg3);width:50px;height:50px;border-radius:14px}
.dcta .icbtn.on{color:var(--acc);border-color:rgba(245,165,36,.5);background:var(--accsoft)}
.genres{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}
.genre{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;color:var(--dim);cursor:pointer;transition:all .15s var(--ease)}
.genre:hover{border-color:var(--line2);color:var(--txt);background:var(--bg3)}
.synopsis{color:var(--dim);font-size:14px;line-height:1.65;margin:16px 0 0;white-space:pre-line}
.synopsis.clamped{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.readmore{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--acc);font-size:13px;font-weight:650;background:none;padding:6px 2px;transition:opacity .15s var(--ease)}
.readmore:hover{opacity:.75}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:20px 0 0}
.fact{background:var(--bg2);padding:11px 14px;min-width:0;transition:background .15s var(--ease)}
.fact:hover{background:var(--bg3)}
.fact b{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.fact span{font-size:13.5px;color:var(--txt);line-height:1.4;word-break:break-word}
.fact--wide{grid-column:1 / -1}
.sec{margin:30px 0;animation:secIn .35s var(--ease-out) both}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sec>h2{display:flex;align-items:center;gap:9px;margin:0 0 13px;font-size:16.5px;font-weight:750;letter-spacing:.01em}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.relcard{width:148px;flex:none;scroll-snap-align:start;cursor:pointer}

.chacard{width:104px;flex:none;scroll-snap-align:center;text-align:center;cursor:default}
.chacard .cha-img{width:88px;height:88px;margin:0 auto;border-radius:50%;overflow:hidden;border:1px solid var(--line2);background:var(--bg3)}

.chacard .cha-name{margin-top:8px;font-size:12.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chacard .cha-va{margin-top:3px;font-size:11px;color:var(--faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.wolist{display:flex;flex-direction:column;gap:8px;counter-reset:wo}
.worow{display:flex;align-items:center;gap:12px;padding:9px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);cursor:pointer;counter-increment:wo;transition:all .18s var(--ease)}
.worow:hover{border-color:var(--line2);background:var(--bg3)}
.worow.cur{border-color:rgba(245,165,36,.55);background:var(--accsoft);box-shadow:0 0 0 1px rgba(245,165,36,.25)}
.worow .wo-n{width:30px;height:30px;flex:none;border-radius:10px;background:var(--bg4);color:var(--dim);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px}
.worow.cur .wo-n{background:var(--acc);color:#20180a}
.worow .wo-img{width:44px;height:60px;border-radius:8px;object-fit:cover;background:var(--bg4);flex:none}
.worow .wo-t{min-width:0;flex:1}
.worow .wo-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worow.cur .wo-title{color:var(--txt)}
.worow .wo-meta{font-size:11.5px;color:var(--faint);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.worow .wo-here{margin-left:auto;color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none;display:inline-flex;align-items:center;gap:5px}
.worow .wo-here::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulseDot 1.6s var(--ease) infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.5}}

/* season / specials tab pills */
.reltabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.reltab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:12.5px;font-weight:650;cursor:pointer;transition:all .15s var(--ease);display:inline-flex;align-items:center;gap:6px}
.reltab .n{background:var(--bg4);color:var(--faint);font-size:10.5px;padding:1px 7px;border-radius:8px;font-weight:700;letter-spacing:.03em}
.reltab:hover{color:var(--txt);border-color:var(--line2)}
.reltab.on{background:var(--accsoft);border-color:rgba(245,165,36,.55);color:var(--acc)}
.reltab.on .n{background:rgba(245,165,36,.25);color:var(--acc)}

/* ---------- watch ---------- */
.watch-top{display:flex;align-items:center;gap:8px;padding:10px 0 2px}
.watch-top .wt-info{min-width:0;flex:1}
.watch-top .wt-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-top .wt-sub{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-wrap{margin:10px 0 0;background:#000;position:relative;width:100%}
@media(min-width:700px){.player-wrap{margin:10px auto 0;border-radius:18px;overflow:hidden;max-width:960px;border:1px solid var(--line)}}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-touch-callout:none}
.player video,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
.player.embed-mode{aspect-ratio:16/9;height:auto;min-height:0;width:100%;position:relative}
.player.embed-mode .pctl,
.player.embed-mode .ptop,
.player.embed-mode .tapzone,
.player.embed-mode .skipbtn,
.player.embed-mode .centerplay,
.player.embed-mode .vign{display:none !important}
/* v1.0.1: .pload / .perr / .endcard are intentionally NOT hidden in embed mode.
   - .pload: shows "Loading EP N" while the iframe reloads after N/P
   - .perr: shows error messages when the stream fails to resolve
   - .endcard: shows "Next episode" button when the current episode ends
   Previously these were all hidden via `display:none !important`, which meant
   embed-mode episode switches and stream errors were invisible to the user.
   Now they use their default CSS (display:flex) and JS toggles them via
   inline `style.display='none'` / `style.display=''` as usual.             */
.player.embed-mode iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border:0;display:block;background:#000;
}
@media(max-width:699px){
  .player-wrap.embed-wrap{margin:10px 0 0;border-radius:0}
  .player.embed-mode{aspect-ratio:16/9;width:100vw;max-width:100vw}
}
.player-wrap:fullscreen,
.player-wrap:-webkit-full-screen{

  display:flex;align-items:center;justify-content:center;
}
.player-wrap:fullscreen .player,
.player-wrap:-webkit-full-screen .player{
  aspect-ratio:auto;width:100%;height:100%;max-width:none;
}
.player-wrap:fullscreen .player video,
.player-wrap:-webkit-full-screen .player video{
  object-fit:contain;
}
.player-wrap:fullscreen .pctl,
.player-wrap:-webkit-full-screen .pctl{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.player-wrap:fullscreen .ptop,
.player-wrap:-webkit-full-screen .ptop{padding-top:calc(8px + env(safe-area-inset-top))}
.player-wrap.embed-wrap{background:#000}
@media(min-width:700px){
  .player-wrap.embed-wrap{border-radius:18px;overflow:hidden}
}
.player .vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.35)}
.pload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,4,2,.55);z-index:8;animation:fadeIn .2s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pload span{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.centerplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;pointer-events:none}
.centerplay .cp-btn{pointer-events:auto}
.centerplay .cp-btn{width:76px;height:76px;border-radius:50%;background:none;border:0;color:var(--acc);
  display:flex;align-items:center;justify-content:center;backdrop-filter:none;-webkit-backdrop-filter:none;transition:transform .12s var(--ease);filter: drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.centerplay .cp-btn:active{transform:scale(.92)}
.centerplay .cp-btn svg.ic{width:32px;height:32px;margin-left:4px;stroke-width:2;fill: rgba(0,0,0,.35);
  stroke: var(--acc);}
.tapzone{position:absolute;top:0;bottom:24%;width:31%;z-index:5;display:none;align-items:center;justify-content:center}
.tapzone--l{left:0}.tapzone--r{right:0}
.tapzone.show{display:flex}
.ripple{position:absolute;width:84px;height:84px;border-radius:50%;background:rgba(12,10,7,.55);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;opacity:0;pointer-events:none;border:1px solid rgba(255,255,255,.14)}
.ripple svg.ic{width:22px;height:22px}
.ripple.go{animation:rip .5s var(--ease-out)}
@keyframes rip{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
.pctl{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:26px 10px 8px;
  background:linear-gradient(180deg,transparent,rgba(5,4,2,.82) 78%);opacity:1;transition:opacity .28s var(--ease),transform .28s var(--ease)}
.pctl.hide{opacity:0;pointer-events:none;transform:translateY(4px)}
.ptop{position:absolute;left:0;right:0;top:0;z-index:9;padding:8px 10px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(0deg,transparent,rgba(5,4,2,.75) 82%);opacity:1;transition:opacity .28s var(--ease),transform .28s var(--ease)}
.ptop.hide{opacity:0;pointer-events:none;transform:translateY(-4px)}
.ptop .pt-title{font-size:13px;font-weight:650;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pcbar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.pcbar .track{position:relative;height:4px;width:100%;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;transition:height .15s var(--ease)}
.pcbar:hover .track{height:6px}
.pcbar .buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);width:0;transition:width .15s linear}
.pcbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);width:0;transition:width .05s linear}
.pcbar .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--acc);transform:translate(-50%,-50%) scale(0);box-shadow:0 1px 6px rgba(0,0,0,.5);transition:transform .15s var(--ease-spring)}
.pcbar:hover .knob,.pcbar.dragging .knob{transform:translate(-50%,-50%) scale(1)}
.pcbar-tip{position:absolute;bottom:calc(100% + 10px);transform:translateX(-50%);background:rgba(16,13,8,.96);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-family:var(--mono);font-size:11px;color:var(--txt);pointer-events:none;opacity:0;transition:opacity .12s var(--ease);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:12}
.pcbar-tip.show{opacity:1}
.pcbar-tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--line2)}
.pcbar.dragging .track{height:8px}
.pcrow{display:flex;align-items:center;gap:2px;margin-top:2px}
.pcbtn{width:44px;height:42px;display:flex;align-items:center;justify-content:center;color:#eee;border-radius:11px;position:relative;flex:none;transition:color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
.pcbtn:hover{color:#fff;background:rgba(255,255,255,.09)}
.pcbtn:active{transform:scale(.9)}
.pcbtn:disabled{opacity:.35;pointer-events:none}
.pcbtn svg.ic{width:21px;height:21px}
.timewrap{font-family:var(--mono);font-size:12px;color:#ddd;letter-spacing:.02em;white-space:nowrap;padding:0 8px;flex:none}
.pc-sp{flex:1}
@media(max-width:520px){
  .pctl{padding:20px 6px 6px}
  .pcrow{gap:0}
  .pcbtn{width:38px;height:38px;border-radius:9px}
  .pcbtn svg.ic{width:19px;height:19px}
  .timewrap{font-size:11px;padding:0 4px}
  .ptop .pcbtn[aria-label="Picture in picture"],
  .ptop .pcbtn[aria-label="Mute"]{display:none}
  .pcpop{top:50px;right:4px}
  .skipbtn{right:8px;bottom:60px;padding:8px 12px;font-size:12px}

}
@media(max-width:380px){
  .pcbtn{width:34px;height:34px}

}
/* phone landscape: keep the whole player on screen without scrolling */
@media(max-height:500px) and (orientation:landscape){
  .player-wrap{margin:6px 0 0}
  .player{aspect-ratio:auto;height:calc(100dvh - 72px);min-height:200px}
}
.pcpop{position:absolute;top:58px;right:6px;background:rgba(16,13,8,.96);border:1px solid var(--line2);border-radius:14px;min-width:172px;
  box-shadow:var(--shadow);z-index:20;display:none;overflow-x:hidden;overflow-y:auto;
  max-height:min(300px,72%);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;animation:suggPop .18s var(--ease-out)}
.pcpop.open{display:block}
.pcpop::-webkit-scrollbar{width:8px}
.pcpop::-webkit-scrollbar-thumb{background:#3b3020;border-radius:6px}
.pcpop::-webkit-scrollbar-track{background:transparent}
.pcpop .pop-hd{padding:9px 14px 5px;font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.popitem{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13.5px;color:var(--dim);cursor:pointer;white-space:nowrap;transition:background .12s var(--ease),color .12s var(--ease)}
.popitem:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.popitem.sel{color:var(--acc);font-weight:650}
.popitem svg.ic{width:16px;height:16px;opacity:0}
.popitem.sel svg.ic{opacity:1}
.skipbtn{position:absolute;right:12px;bottom:74px;z-index:9;background:rgba(12,10,7,.72);border:1px solid rgba(245,165,36,.6);color:var(--acc);
  border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:.02em;display:none;align-items:center;gap:7px;backdrop-filter:blur(6px);animation:skipPop .25s var(--ease-spring)}
@keyframes skipPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.skipbtn.show{display:inline-flex}
.skipbtn:hover{background:rgba(20,16,10,.85);border-color:rgba(245,165,36,.85)}
.endcard{position:absolute;inset:0;z-index:12;background:rgba(5,4,2,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;backdrop-filter:blur(8px)}
.endcard.show{display:flex;animation:fadeIn .3s var(--ease-out)}
.endcard h3{margin:0;font-size:15px;color:var(--dim);font-weight:600;letter-spacing:.03em}
.endcard .btn{min-width:210px}
.endcard .ec-sub{font-size:12.5px;color:var(--faint)}
.perr{position:absolute;inset:0;z-index:11;background:rgba(5,4,2,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.perr.show{display:flex;animation:fadeIn .25s var(--ease-out)}
.perr svg.ic{width:36px;height:36px;color:var(--err);stroke-width:1.5}
.perr h3{margin:0;font-size:15.5px}
.perr p{margin:0;font-size:12.5px;color:var(--faint);max-width:300px}
.perr .row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.wctl-row{display:flex;align-items:center;gap:9px;margin:14px 0 2px;flex-wrap:wrap}
.wctl-row .lbl{font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);min-width:52px}
.srvrow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.srvrow::-webkit-scrollbar{display:none}
.srvchip{display:flex;align-items:center;justify-content:center;gap:1px;min-height:44px;padding:7px 16px;border-radius:13px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;flex:none;transition:all .15s var(--ease)}
.srvchip:hover{border-color:#4d3f28;background:var(--bg4)}
.srvchip b{font-size:13.5px;font-weight:700;letter-spacing:.02em}
.srvchip span{font-size:10.5px;color:var(--faint);letter-spacing:.03em}
.srvchip.on{border-color:rgba(245,165,36,.6);background:var(--accsoft);color:var(--acc)}
.srvchip.on span{color:#c19344}
.srvchip--dub.on{border-color:rgba(127,192,255,.5);background:rgba(127,192,255,.1);color:var(--dub)}
.srvchip--dub.on span{color:#6da6d8}
.modegrp{display:flex;gap:8px}
.epgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:14px}
.epcard{position:relative;border-radius:13px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);cursor:pointer;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}
.epcard:active{transform:scale(.98)}
.epcard:hover{border-color:var(--line2);box-shadow:var(--shadow-soft)}
.epcard.cur{border-color:rgba(245,165,36,.7);box-shadow:0 0 0 1px rgba(245,165,36,.35),var(--shadow-soft)}
.epcard .epthumb{aspect-ratio:16/9;background:var(--bg3);position:relative;overflow:hidden}
.epcard img{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease)}
.epcard:hover img{transform:scale(1.06)}
.epcard .epnum{position:absolute;top:7px;left:7px;background:rgba(8,6,4,.85);color:var(--txt);border-radius:7px;font-size:10.5px;font-weight:800;padding:2px 7px;letter-spacing:.06em}
.epcard.cur .epnum{background:var(--acc);color:#20180a}
.epcard .epplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s var(--ease);background:rgba(5,4,2,.35);color:#fff}
.epcard:hover .epplay,.epcard.cur .epplay{opacity:1}
.epcard .epname{padding:9px 11px 11px;font-size:12.5px;line-height:1.35;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.epcard.cur .epname{color:var(--txt)}
.epcard .ep-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.epcard .ep-prog i{display:block;height:100%;background:var(--acc)}
.epbadge{position:absolute;top:7px;right:7px}
.eplist-note{margin:8px 2px 0;color:var(--faint);font-size:11.5px}

/* ---------- library ---------- */
.tabs{display:flex;gap:8px;margin:16px 0 4px}
.tab{flex:1;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-weight:650;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .15s var(--ease)}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{border-color:rgba(245,165,36,.55);background:var(--accsoft);color:var(--acc)}
.histrow{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);margin-top:10px;cursor:pointer;transition:all .18s var(--ease)}
.histrow:hover{border-color:var(--line2);background:var(--bg3)}
.histrow .hr-img{width:86px;aspect-ratio:16/9;border-radius:9px;object-fit:cover;background:var(--bg3);flex:none}
.histrow .hr-t{min-width:0;flex:1}
.histrow .hr-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.histrow .hr-x{flex:none}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:rgba(22,18,11,.96);border:1px solid var(--line2);
  color:var(--txt);padding:11px 18px;border-radius:13px;font-size:13px;box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .25s var(--ease-spring);max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- changelog modal ---------- */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,4,2,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal.open{display:flex;animation:fadeIn .2s var(--ease)}
.modal-card{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;max-width:540px;width:100%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:modalPop .25s var(--ease-spring)}
@keyframes modalPop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-hd{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-hd h2{margin:0;font-size:17px;font-weight:750;display:flex;align-items:center;gap:8px}
.modal-hd .ver-tag{background:var(--accsoft);color:var(--acc);border:1px solid rgba(245,165,36,.35);padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.modal-hd .x{margin-left:auto}
.modal-bd{padding:16px 20px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-bd::-webkit-scrollbar{width:8px}
.modal-bd::-webkit-scrollbar-thumb{background:#3b3020;border-radius:6px}
.cl-section{margin:14px 0}
.cl-section:first-child{margin-top:0}
.cl-section h3{margin:0 0 8px;font-size:13.5px;font-weight:750;color:var(--acc);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px}
.cl-section h3 .n{background:var(--bg4);color:var(--dim);font-size:10.5px;padding:1px 7px;border-radius:8px;font-weight:700;letter-spacing:.03em;text-transform:none}
.cl-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.cl-list li{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--dim);line-height:1.5;padding-left:0}
.cl-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc);flex:none;margin-top:8px;opacity:.7}
.cl-list li b{color:var(--txt);font-weight:650}
.cl-list li code{background:var(--bg4);color:var(--acc);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:11.5px}

/* ---------- responsive ---------- */
@media(min-width:640px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px}
  .epgrid{grid-template-columns:repeat(3,1fr);gap:14px 12px}
  .dhero{min-height:300px}
  .dbody{margin-top:-120px}
  .dposter{width:140px}
  .dtitle{font-size:26px}
  .facts{grid-template-columns:1fr 1fr 1fr}
  .hero{padding-top:12dvh}
}
@media(min-width:980px){
  body{font-size:15.5px}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .epgrid{grid-template-columns:repeat(4,1fr)}
  .dhero{min-height:360px}
  .dbody{margin-top:-150px}
  .dposter{width:168px}
  .dhead{gap:22px}
  .dtitle{font-size:30px}
  .watch-cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
  .epside{position:sticky;top:calc(var(--hd-h) + 12px);max-height:calc(100dvh - var(--hd-h) - 24px);overflow-y:auto;padding-right:2px}
  .epgrid{grid-template-columns:1fr;gap:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}
.searchbar input:focus,
.searchbar input:focus-visible{
  outline:none;
}
.searchbar input[type="search"]::-webkit-search-cancel-button,
.searchbar input[type="search"]::-webkit-search-decoration{
  -webkit-appearance:none;
  appearance:none;
}

/* ---------- watch page new styles ---------- */
.watch-toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);
  background:var(--bg3);color:var(--faint);font-size:12px;font-weight:650;letter-spacing:.02em;white-space:nowrap;transition:all .15s var(--ease);cursor:pointer;flex:1 1 auto;justify-content:center;min-width:0;position:relative}
.toggle-chip:hover{color:var(--dim);border-color:#4d3f28}
.toggle-chip:active{transform:scale(.96)}
.toggle-chip.on{background:var(--accsoft);border-color:rgba(245,165,36,.55);color:var(--acc)}
.toggle-chip svg.ic{width:14px;height:14px;flex:none}
/* v1.0.5: Mobile toggles now show short text labels instead of icon-only.
   On mobile, the full label is hidden and a short label (from data-short)
   is shown via ::after. This makes each toggle identifiable at a glance.    */
@media(max-width:560px){
  .watch-toggles{gap:6px}
  .toggle-chip{flex:1 1 calc(25% - 6px);min-height:50px;padding:4px 2px;flex-direction:column;gap:3px;font-size:0;line-height:1;position:relative}
  .watch-toggles .toggle-chip svg.ic{width:16px !important;height:16px !important}
  /* Hide the full text label on mobile (font-size:0 above already does this) */
  .toggle-chip::after{content:attr(data-short);font-size:9px;font-weight:700;letter-spacing:.02em;color:inherit;white-space:nowrap}
  .toggle-chip.on::before{content:"";position:absolute;bottom:-1px;left:25%;right:25%;height:2px;background:var(--acc);border-radius:2px}
}
.ep-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ep-row::-webkit-scrollbar{display:none}
/* v1.0.7: Removed the ep-grid (wrapping grid) — reverted to horizontal scroll
   for all shows, with pagination for long-running ones (25 episodes per page). */
.ep-grid-empty{padding:24px;text-align:center;color:var(--faint);font-size:13px}
/* Filter input in the Episodes header */
.ep-filter-input{width:120px;height:34px;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;color:var(--txt);
  font-family:var(--mono);font-size:12.5px;padding:0 10px;outline:none;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.ep-filter-input::placeholder{color:var(--faint)}
.ep-filter-input:focus{border-color:rgba(245,165,36,.6);box-shadow:0 0 0 3px rgba(245,165,36,.12)}
/* v1.0.7: Pagination controls for long episode lists */
.ep-pagination{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 4px;flex-wrap:wrap}
.ep-pagination .ep-page-btn{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg3);color:var(--dim);font-size:12.5px;font-weight:650;cursor:pointer;transition:all .15s var(--ease);display:inline-flex;align-items:center;gap:5px}
.ep-pagination .ep-page-btn:hover{color:var(--txt);border-color:#4d3f28;background:var(--bg4)}
.ep-pagination .ep-page-btn:active{transform:scale(.96)}
.ep-pagination .ep-page-btn:disabled{opacity:.35;pointer-events:none}
.ep-pagination .ep-page-info{font-size:12px;color:var(--faint);font-family:var(--mono);min-width:80px;text-align:center}
.ep-card-sm{width:140px;flex:none;scroll-snap-align:start;cursor:pointer;border-radius:11px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);position:relative;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}
.ep-card-sm:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow-soft)}
.ep-card-sm:active{transform:scale(.98)}
.ep-card-sm.cur{border-color:rgba(245,165,36,.7);box-shadow:0 0 0 1px rgba(245,165,36,.35),var(--shadow-soft)}
.ep-card-sm .epthumb{aspect-ratio:16/9;background:var(--bg3);position:relative;overflow:hidden}
.ep-card-sm img{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease)}
.ep-card-sm:hover img{transform:scale(1.06)}
.ep-card-sm .epnum{position:absolute;top:5px;left:5px;background:rgba(8,6,4,.85);color:var(--txt);border-radius:5px;font-size:9.5px;font-weight:800;padding:1px 6px;letter-spacing:.05em}
.ep-card-sm.cur .epnum{background:var(--acc);color:#20180a}
.ep-card-sm .epname{padding:7px 8px 8px;font-size:11.5px;line-height:1.3;color:var(--dim);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;min-height:28px;white-space:nowrap}
.ep-card-sm.cur .epname{color:var(--txt)}
.ep-card-sm .ep-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.ep-card-sm .ep-prog i{display:block;height:100%;background:var(--acc)}
.ep-card-sm .ep-finish{position:absolute;top:5px;right:5px;background:rgba(76,195,138,.85);color:#fff;border-radius:4px;font-size:8px;font-weight:700;padding:1px 5px;letter-spacing:.04em}

/* long-press 2x pill */
.speed-pill{
  position:absolute;
  top:5%;
  left:50%;
  transform:translate(-50%,0);
  background:transparent;
  border:none;
  color:var(--acc);
  font-size:10px;
  font-weight:600;
  padding:0;
  border-radius:0;
  z-index:30;
  display:none;
  backdrop-filter:none;
  letter-spacing:.04em;
  text-shadow:0 0 6px rgba(0,0,0,.6);
}
.speed-pill.show{display:block}

/* keyboard hint */
.kbd-hint{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px 14px;margin:8px 0 0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.kbd-hint .kbd{font-size:10px}
.kbd-hint .dismiss{color:var(--dim);cursor:pointer;font-weight:650;padding:2px 6px;border-radius:6px;transition:background .15s var(--ease),color .15s var(--ease)}
.kbd-hint .dismiss:hover{color:var(--txt);background:var(--bg3)}

/* relation badge on cards */
.rel-badge{position:absolute;bottom:6px;left:6px;background:rgba(12,10,7,.82);color:var(--dim);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.05em;text-transform:uppercase}
.rel-badge.cur{background:var(--acc);color:#20180a}

/* seasons row on watch page */
.season-row .hcard{width:130px}
.season-row .hcard .hposter{width:130px}

/* compact server row */
.srvrow-compact{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.srvrow-compact::-webkit-scrollbar{display:none}
.srv-chip-sm{display:flex;align-items:center;justify-content:center;min-height:36px;padding:5px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;flex:none;font-size:12.5px;font-weight:650;color:var(--dim);transition:all .15s var(--ease)}
.srv-chip-sm:hover{color:var(--txt);border-color:#4d3f28;background:var(--bg4)}
.srv-chip-sm.on{border-color:rgba(245,165,36,.6);background:var(--accsoft);color:var(--acc)}
.srv-chip-sm.dub.on{border-color:rgba(127,192,255,.5);background:rgba(127,192,255,.1);color:var(--dub)}

/* view transition: fade between routes */
#view{animation:viewIn .25s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============ Title-language subtitle on cards ============ */
.hcard-sub{margin-top:1px;font-size:11px;color:var(--faint);font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;height:1.3em}
.hcard[data-has-sub="1"] .hcard-sub{display:block}
.ep-card-sm .epname-sub,.sugg-meta .sugg-sub{font-size:10.5px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* When subtitle is hidden by setting, hide everywhere */
body[data-title-lang="romaji"] .hcard-sub,
body[data-title-lang="english"] .hcard-sub,
body[data-title-lang="native"] .hcard-sub{display:none}
body[data-title-lang="english"] .hcard-title,
body[data-title-lang="english"] .sugg-title,
body[data-title-lang="english"] .hr-title,
body[data-title-lang="english"] .wo-title,
body[data-title-lang="english"] .pt-title,
body[data-title-lang="english"] .hd-title,
body[data-title-lang="english"] .dtitle{font-weight:700}
body[data-title-lang="english"] .hcard[data-has-sub="1"] .hcard-sub,
body[data-title-lang="both"] .hcard[data-has-sub="1"] .hcard-sub{display:block}

/* ============ Settings modal ============ */
.settings-section{margin:18px 0;padding-bottom:18px;border-bottom:1px solid var(--line)}
.settings-section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.settings-section h3{margin:0 0 12px;font-size:13px;font-weight:750;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.settings-section h3 svg.ic{width:14px;height:14px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;min-height:42px}
.settings-row .lbl{font-size:13.5px;color:var(--txt);font-weight:600;min-width:0;flex:1}
.settings-row .lbl small{display:block;font-size:11.5px;color:var(--faint);font-weight:400;margin-top:2px}
.settings-row .ctl{flex:none;display:flex;align-items:center;gap:6px}
/* Mobile: stack label above control, full-width swatches */
@media(max-width:560px){
  .settings-row{flex-direction:column;align-items:stretch;gap:8px}
  .settings-row .ctl{flex:none;width:100%;justify-content:flex-start;flex-wrap:wrap}
  .settings-row .lbl{flex:none}
}
/* Segmented control */
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:650;color:var(--dim);transition:all .15s var(--ease);min-height:30px}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--accsoft);color:var(--acc)}
/* Accent swatches */
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid var(--line2);cursor:pointer;position:relative;transition:transform .15s var(--ease),border-color .15s var(--ease)}
.swatch:hover{transform:scale(1.08)}
.swatch.on{border-color:var(--txt)}
.swatch.on::after{content:"";position:absolute;inset:0;border-radius:8px;border:2px solid rgba(255,255,255,.4);pointer-events:none}
.swatch.custom{display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,#ff8589,#ffc25c,#4cc38a,#7fc0ff,#c98bff);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;overflow:hidden;padding:0 10px;width:auto;min-width:34px}
.swatch.custom::before{content:"🎨";font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));position:relative;z-index:1}
/* Custom swatch uses ::after for its label text instead of the white ring */
.swatch.custom::after{content:"Custom";text-shadow:0 1px 2px rgba(0,0,0,.5);position:relative;z-index:1;background:transparent;border:0}
.swatch.custom.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.swatch input[type="color"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* Mobile: larger touch targets, custom swatch fills available width */
@media(max-width:560px){
  .swatch{width:40px;height:40px;border-radius:11px}
  .swatches{gap:10px;width:100%}
  .swatch.custom{flex:1 1 auto;min-width:120px;height:40px;border-radius:11px;font-size:12px;padding:0 12px}
  .swatch.custom::before{font-size:18px}
}
/* Range slider */
.range-wrap{display:flex;align-items:center;gap:10px;min-width:160px}
.range-wrap input[type="range"]{-webkit-appearance:none;appearance:none;width:120px;height:4px;background:var(--line2);border-radius:4px;outline:none}
.range-wrap input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;background:var(--acc);border-radius:50%;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.range-wrap input[type="range"]::-moz-range-thumb{width:14px;height:14px;background:var(--acc);border-radius:50%;border:0;cursor:pointer}
.range-wrap .val{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:36px;text-align:right}
/* Number input */
.num-input{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.num-input button{width:32px;height:32px;color:var(--dim);font-size:14px;font-weight:700}
.num-input button:hover{color:var(--txt);background:var(--bg4)}
.num-input input{width:54px;text-align:center;background:none;border:0;color:var(--txt);font-family:var(--mono);font-size:13px;padding:0;height:32px}
.num-input input:focus{outline:none}
/* Danger button */
.btn--danger{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);color:#ff8589}
.btn--danger:hover{background:rgba(229,72,77,.2);border-color:rgba(229,72,77,.65)}

/* ============ Skip Outro button ============ */
.skipbtn.skip-outro{border-color:rgba(127,192,255,.6);color:var(--dub)}
.skipbtn.skip-outro:hover{background:rgba(20,16,10,.85);border-color:rgba(127,192,255,.85)}
.skipbtn.skip-outro svg.ic{width:14px;height:14px}

/* ============ Resume modal ============ */
.resume-modal{position:absolute;inset:0;z-index:14;background:rgba(5,4,2,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.resume-modal.show{display:flex;animation:fadeIn .25s var(--ease-out)}
.resume-modal h3{margin:0;font-size:17px;font-weight:700;color:var(--txt)}
.resume-modal p{margin:0;font-size:13px;color:var(--dim);max-width:300px;line-height:1.5}
.resume-modal .resume-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ============ Auto-next countdown pill ============ */
.next-pill{position:absolute;right:12px;bottom:74px;z-index:9;background:rgba(12,10,7,.85);border:1px solid rgba(245,165,36,.55);color:var(--acc);
  border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:650;display:none;align-items:center;gap:9px;backdrop-filter:blur(6px);animation:skipPop .25s var(--ease-spring)}
.next-pill.show{display:inline-flex}
.next-pill .np-ring{width:18px;height:18px;flex:none;position:relative}
.next-pill .np-ring svg{width:18px;height:18px;transform:rotate(-90deg)}
.next-pill .np-ring circle{fill:none;stroke:rgba(245,165,36,.25);stroke-width:2}
.next-pill .np-ring .np-prog{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.next-pill .np-text{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.next-pill .np-text b{font-weight:700;color:var(--txt)}
.next-pill .np-text span{font-size:10.5px;color:var(--dim)}
.next-pill .np-cancel{margin-left:6px;color:var(--faint);font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;cursor:pointer;background:rgba(255,255,255,.06)}
.next-pill .np-cancel:hover{color:var(--txt);background:rgba(255,255,255,.12)}

/* ============ Server health indicator ============ */
.srv-chip-sm .srv-health,.srvchip .srv-health{display:inline-flex;align-items:center;justify-content:center;width:7px;height:7px;border-radius:50%;margin-left:5px;background:var(--faint);flex:none}
.srv-chip-sm.on .srv-health,.srvchip.on .srv-health{background:var(--acc)}
.srv-health.best{background:var(--ok);box-shadow:0 0 6px rgba(76,195,138,.5)}
.srv-health.warn{background:#ff8589;box-shadow:0 0 6px rgba(255,133,137,.5)}

/* ============ Buffered ranges viz (multi-stripe) ============ */
.pcbar .ranges{position:absolute;left:0;top:0;bottom:0;width:100%;pointer-events:none}
.pcbar .range-stripe{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.18);border-radius:0}

/* ============ Bookmark dropdown + status badges + confirm dialog ============ */
.bm-pop{position:absolute;z-index:60;background:rgba(16,13,8,.97);border:1px solid var(--line2);border-radius:14px;
  min-width:200px;box-shadow:var(--shadow);overflow:hidden;animation:suggPop .18s var(--ease-out);
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.bm-pop .bm-hd{padding:9px 14px 6px;font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.bm-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--dim);cursor:pointer;
  white-space:nowrap;transition:background .12s var(--ease),color .12s var(--ease)}
.bm-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.bm-item.sel{color:var(--txt);font-weight:650}
.bm-item .bm-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;opacity:.85}
.bm-item.sel .bm-dot{box-shadow:0 0 8px currentColor}
.bm-item .bm-label{flex:1;min-width:0}
.bm-item .bm-check{opacity:0;color:var(--acc)}
.bm-item.sel .bm-check{opacity:1}
.bm-item.bm-remove{color:var(--err);border-top:1px solid var(--line)}
.bm-item.bm-remove:hover{background:rgba(229,72,77,.08);color:#ff8589}
.bm-item.bm-remove .bm-dot{background:var(--err)}
.bm-current-hint{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line);line-height:1.4}
.bm-current-hint .bm-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.bm-current-hint b{color:var(--txt);font-weight:650}
.bm-card-ago{margin-top:2px;font-size:10.5px;color:var(--faint);font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard[data-bm-key]{transition:transform .15s var(--ease),opacity .15s var(--ease),border-color .15s var(--ease)}
.hcard[data-bm-key].bm-dragging{opacity:.5;transform:scale(.95);cursor:grabbing}
.hcard[data-bm-key].bm-drop-target{outline:2px dashed var(--acc);outline-offset:3px;border-radius:13px}
.hcard[data-bm-key][draggable="true"]{cursor:grab}
.hcard[data-bm-key][draggable="true"]:active{cursor:grabbing}
.bm-grid .hcard{touch-action:pan-y}
.bm-status-badge{position:absolute;top:6px;left:6px;display:inline-flex;align-items:center;gap:4px;
  background:rgba(12,10,7,.85);backdrop-filter:blur(6px);border-radius:7px;padding:3px 7px;
  font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--txt);
  border:1px solid var(--line);pointer-events:none}
.bm-status-badge .bm-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.bm-status-badge.status-planning{color:var(--faint)}
.bm-status-badge.status-watching{color:var(--acc)}
.bm-status-badge.status-completed{color:var(--ok)}
.bm-status-badge.status-paused{color:var(--dim)}
.bm-status-badge.status-dropped{color:var(--err)}
.bm-toggle{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:10px;
  background:rgba(8,6,4,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  color:var(--dim);cursor:pointer;transition:color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease);z-index:2}
.bm-toggle:hover{color:var(--txt);background:rgba(20,16,10,.95)}
.bm-toggle:active{transform:scale(.92)}
.bm-toggle.on{color:var(--acc)}
.bm-toggle.on.status-watching{color:var(--acc)}
.bm-toggle.on.status-completed{color:var(--ok)}
.bm-toggle.on.status-planning{color:var(--faint)}
.bm-toggle.on.status-paused{color:var(--dim)}
.bm-toggle.on.status-dropped{color:var(--err)}
.bm-filter-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bm-filter-row::-webkit-scrollbar{display:none}
.bm-filter-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:12px;font-weight:650;
  white-space:nowrap;cursor:pointer;flex:none;transition:all .15s var(--ease)}
.bm-filter-chip:hover{color:var(--txt);border-color:var(--line2)}
.bm-filter-chip .bm-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.bm-filter-chip .bm-count{background:var(--bg4);color:var(--faint);font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700}
.bm-filter-chip.on{background:var(--accsoft);border-color:rgba(245,165,36,.5);color:var(--acc)}
.bm-filter-chip.on .bm-count{background:rgba(245,165,36,.2);color:var(--acc)}
.bm-group-hd{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:13px;font-weight:750;letter-spacing:.02em}
.bm-group-hd .bm-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.bm-group-hd .bm-count{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600;background:var(--bg3);padding:2px 8px;border-radius:6px}
/* Confirm dialog modal */
#confirmModal .modal-card{max-width:400px}
.confirm-body{padding:4px 0 16px}
.confirm-body p{margin:0 0 4px;font-size:14px;color:var(--txt);line-height:1.5}
.confirm-body small{font-size:12.5px;color:var(--faint);line-height:1.45;display:block;margin-top:4px}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.confirm-actions .btn{min-height:40px;padding:0 16px;font-size:13.5px}
/* v1.0.4: Resume modal checkbox + episode jump input + settings new rows */
.resume-modal .resume-dontask{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--dim);cursor:pointer;justify-content:center}
.resume-modal .resume-dontask input{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
.ep-jump-input{width:64px;height:34px;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;color:var(--txt);
  font-family:var(--mono);font-size:13px;text-align:center;padding:0 4px;outline:none}
.ep-jump-input:focus{border-color:rgba(245,165,36,.6);box-shadow:0 0 0 3px rgba(245,165,36,.12)}
.ep-jump-input::-webkit-inner-spin-button,.ep-jump-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.settings-row .ctl .backup-btns{display:flex;gap:6px;flex-wrap:wrap}

/* ============ Subtitle styling (cue) ============ */
.player video::cue{font-size:var(--cue-size, 18px);line-height:1.4;background:rgba(0,0,0,var(--cue-bg, .65));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
</style>

<script>
/* ================= AniKuoshi v1.0.8 — core ================= */
'use strict';

const APP_VERSION = '1.0.8';
const API_BASE = 'https://api-kuoshi.onrender.com';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------- tiny DOM builder ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;            // trusted, internal markup only
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(9)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
function ic(name, size) {
  const s = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(s, 'svg');
  svg.setAttribute('class', 'ic');
  if (size) { svg.style.width = size + 'px'; svg.style.height = size + 'px'; }
  const use = document.createElementNS(s, 'use');
  use.setAttribute('href', '#i-' + name);
  svg.append(use);
  return svg;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function stripHtml(s) {
  if (!s) return '';
  const t = document.createElement('textarea');
  t.innerHTML = String(s);
  return t.value.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '').replace(/\n{3,}/g, '\n\n').trim();
}

/* ---------- formatting ---------- */
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return hh ? `${hh}:${p(mm)}:${p(ss)}` : `${mm}:${p(ss)}`;
}
function fmtCount(n) {
  if (n == null) return '';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}
function metaLine(e) {
  const parts = [];
  if (e.type) parts.push(e.type);
  if (e.year) parts.push(e.year);
  if (e.episodes) parts.push(e.episodes === 1 ? '1 ep' : e.episodes + ' eps');
  return parts.join(' \u00b7 ');
}
function decodeEntities(s) {
  if (!s) return '';
  const t = document.createElement('textarea');
  t.innerHTML = String(s);
  return t.value;
}
/* Title helpers — respect the user's title-language setting.
   titleLang values:
     'both'     → English main title, romaji as subtitle (when distinct)
     'english'  → English only (fallback to romaji if English is empty)
     'romaji'   → Romaji only (fallback to English/title if romaji empty) — original behavior
     'native'   → Native only (fallback to romaji)                                    */
function titleMain(e) {
  if (!e) return 'Untitled';
  const lang = Store.settings.titleLang || 'both';
  const romaji = decodeEntities(e.titleRomaji || e.title || '');
  const english = decodeEntities(e.titleEnglish || '');
  const native = decodeEntities(e.titleNative || '');
  if (lang === 'english') return english || romaji || native || e.slug || 'Untitled';
  if (lang === 'native')  return native  || romaji || english || e.slug || 'Untitled';
  if (lang === 'romaji')  return romaji  || english || native || e.slug || 'Untitled';
  /* 'both' — English main, fall back to romaji if English empty */
  return english || romaji || native || e.slug || 'Untitled';
}
function titleSub(e) {
  if (!e) return '';
  const lang = Store.settings.titleLang || 'both';
  if (lang !== 'both') return '';
  const main = titleMain(e);
  const romaji = decodeEntities(e.titleRomaji || e.title || '');
  /* If main IS romaji (English was empty), show native as sub if distinct */
  if (main === romaji) {
    const native = decodeEntities(e.titleNative || '');
    return native && native !== main ? native : '';
  }
  /* Main is English; show romaji as sub if distinct */

/* ---------- caches ---------- */

  set(k, v, ttl) {

  del(k) { this.m.delete(k); },

  KEY: 'anikuoshi:cc',
  read() { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) { return {}; } },
  write(o) {

  peek(path) {
    const o = this.read()[path];

    if (o.exp < Date.now()) return null;
    return o.v;

/* ---------- franchise graph helpers ----------
   The /api/seasons and /api/watch-order endpoints are ASYMMETRIC: querying on
   a sequel returns no franchise data. We must follow PREQUEL relations up to
   the franchise root, then call /api/watch-order/<rootKey> for the full graph.

   ⚠️ CRITICAL: Always use the KEY (anilist:<id> / mal:<id>) when calling
   /api/seasons and /api/watch-order, NEVER the slug. Listing slugs returned
   by /api/anime can be stale and resolve to a different anime (verified bug:
   HELLO WORLD anilist:106240 returns slug "hello-world" which actually
   resolves to "Wo Zai Feitu Shijie Sao Laji" anilist:206275 via the seasons
   endpoint). The KEY is canonical and always correct.                                  */
const Franchise = {
  _rootCache: new Map(),
  async resolveRoot(anime) {
    if (!anime || !anime.key) return anime || null;
    const startKey = anime.key;
    if (this._rootCache.has(startKey)) return this._rootCache.get(startKey);
    let current = anime;
    let hops = 0;
    const visited = new Set();
    while (hops < 8) {
      if (visited.has(current.key)) break;
      visited.add(current.key);
      let prequel = null;
      try {
        const det = await API.get(animeUrl(current.key), 10 * 60000);
        const entries = (det.relations && det.relations.entries) || [];
        prequel = entries.find(e => e && (e.relation === 'PREQUEL' || e.relation === 'prequel'));
      } catch (e) { break; }
      if (!prequel || !prequel.key) break;
      current = prequel;
      hops++;
    }
    this._rootCache.set(startKey, current);
    return current;
  },
  async watchOrder(anime) {
    const root = await this.resolveRoot(anime);
    if (!root || !root.key) return [];
    try {
      /* Always use root.key — slugs can be stale on the API side */
      const woData = await API.get(watchOrderUrl(root.key), 30 * 60000);
      const rows = woData.watchOrder || woData.related || [];
      return rows.slice().sort((a, b) => {
        const ra = Number(a.releaseOrder || a.order || 9999);
        const rb = Number(b.releaseOrder || b.order || 9999);
        if (ra !== rb) return ra - rb;
        return (a.year || 9999) - (b.year || 9999);
      });
    } catch (e) { return []; }
  },
  async fullFranchise(anime) {
    const root = await this.resolveRoot(anime);
    if (!root || !root.key) return { seasons: [], specials: [], watchOrder: [] };
    /* Call both endpoints in parallel using root.KEY (never the slug):
       - /api/seasons/:key       → groups{} (bucketed relations)
       - /api/watch-order/:key   → watchOrder[] (release-sorted franchise timeline) */
    const [sdResult, woResult] = await Promise.allSettled([
      API.get(seasonsUrl(root.key), 30 * 60000),
      API.get(watchOrderUrl(root.key), 30 * 60000)

    if (sdResult.status === 'rejected' && woResult.status === 'rejected') {
      return { groups: {}, watchOrder: [], root, source: 'none' };
    }
    const sd = sdResult.status === 'fulfilled' ? sdResult.value : { groups: {}, source: 'none' };
    const woData = woResult.status === 'fulfilled' ? woResult.value : {};

      const ra = Number(a.releaseOrder || a.order || 9999);
      const rb = Number(b.releaseOrder || b.order || 9999);

/* Categorize an anime entry as a "season" (main TV series) or a "special"
   (movie, OVA, ONA, special, alternative, side story, summary, etc.) */
function categorizeFranchiseEntry(entry, relation) {
  if (!entry) return 'special';
  const t = (entry.type || '').toUpperCase();
  const rel = String(relation || '').toLowerCase();
  // Main-series TV seasons are prequel/sequel/parent TV series
  if (rel === 'prequel' || rel === 'sequel' || rel === 'parent') {
    if (t === 'TV' || t === '' || t === 'UNKNOWN') return 'season';
  }
  // sideStory can be either, but typically goes to specials unless it's TV
  if (rel === 'sidestory') {
    if (t === 'TV') return 'season';
    return 'special';
  }
  // 'self' is the queried anime
  if (rel === 'self') {
    if (t === 'TV' || t === '' || t === 'UNKNOWN') return 'season';
    return 'special';
  }
  // Everything else (movie, ova, ona, special, alternative, spin_off, summary, related, character, other, source)
  if (t === 'MOVIE' || t === 'OVA' || t === 'ONA' || t === 'SPECIAL' || t === 'MUSIC') return 'special';
  if (['alternative', 'spinoff', 'special', 'ova', 'ona', 'movie', 'summary', 'related', 'character', 'other', 'source'].includes(rel)) return 'special';
  // Fall-through: TV with unknown relation
  if (t === 'TV') return 'season';
  return 'special';
}

/* ---------- History grouping helpers (Task 1) ----------

   directly and we don't want a migration). We derive grouping at render time
   via historyGroups() and historyGroupSummary().

   (latest episode, total watched, total finished, headline + progress).    */

  const map = new Map();

    map.get(it.key).items.push(it);

  const pos = latest.pos || 0;
  const dur = latest.dur || 0;
  const pct = dur ? Math.min(100, Math.round((pos / dur) * 100)) : 0;
  const latestFinished = pct >= 96;
  /* Headline: "EP 3 · 12:34 · 2 finished" or "Finished 3 episodes" if all eps done */

    parts.push(latestFinished ? 'finished' : fmtTime(pos));

/* ---------- image with placeholder fallback ----------
   opts.eager  → use loading='eager' + decoding='sync' (above-the-fold, or
                 small lists where a flash of wrong/empty image would be visible)

                 layout shift while the bitmap is decoding.

  opts = opts || {};

    const phAttrs = { class: (cls || '') + ' imph' };
    if (opts.width) phAttrs.width = opts.width;
    if (opts.height) phAttrs.height = opts.height;
    return h('div', phAttrs, ic(iconName || 'film'));
  }
  const attrs = {
    class: cls,
    src: src,
    alt: alt || '',
    loading: opts.eager ? 'eager' : 'lazy',
    decoding: opts.eager ? 'sync' : 'async',
    referrerpolicy: 'no-referrer'

  if (opts.width) attrs.width = opts.width;
  if (opts.height) attrs.height = opts.height;
  const img = h('img', attrs);
  /* Paint a transparent placeholder background while decoding so the browser
     never shows a stale bitmap from a previous render in this slot. */
  if (!opts.eager) img.style.background = 'var(--bg3)';
  img.addEventListener('load', () => { img.style.background = ''; }, { once: true });
  img.addEventListener('error', () => {
    const phAttrs = { class: (cls || '') + ' imph' };
    if (opts.width) phAttrs.width = opts.width;
    if (opts.height) phAttrs.height = opts.height;
    img.replaceWith(h('div', phAttrs, ic(iconName || 'film')));
  }, { once: true });
  return img;
