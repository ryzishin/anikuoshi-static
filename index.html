      /* ---------- Keyboard shortcuts ---------- */
      h('div', { class: 'cl-section' },
        h('h3', null, ic('kbd', 14), 'Keyboard shortcuts', h('span', { class: 'n', text: 'everything is one key away' })),
        h('ul', { class: 'cl-list' },
          h('li', null, h('span', null, h('b', null, 'Space / K'), ' — play or pause')),
          h('li', null, h('span', null, h('b', null, 'J / L'), ' — seek -10s / +10s',
            ',  ', h('b', null, '\u2190 / \u2192'), ' — seek -5s / +5s',
            ',  ', h('b', null, 'Shift+\u2190 / Shift+\u2192'), ' — seek -60s / +60s')),
          h('li', null, h('span', null, h('b', null, ', / .'), ' — frame-step backward / forward')),
          h('li', null, h('span', null, h('b', null, '0-9'), ' — jump to 0%, 10%, 20%, ... 90% of the video')),
          h('li', null, h('span', null, h('b', null, 'Enter'), ' — trigger the visible Skip Opening / Skip Outro button (like YouTube\'s skip ads)')),
          h('li', null, h('span', null, h('b', null, 'Shift+Enter'), ' — skip forward by the configured duration (default 85s, change in Settings)')),
          h('li', null, h('span', null, h('b', null, '\u2191 / \u2193'), ' — volume up / down,  ', h('b', null, 'M'), ' — mute')),
          h('li', null, h('span', null, h('b', null, 'F'), ' — toggle fullscreen,  ', h('b', null, 'C'), ' — cycle subtitle tracks')),
          h('li', null, h('span', null, h('b', null, 'N / P'), ' — next / previous episode (keeps fullscreen, prompts to resume; works in Embed mode too)')),
          h('li', null, h('span', null, h('b', null, 'Esc'), ' — close popups'))
        )
      ),

      /* ---------- Credits ---------- */
      h('div', { class: 'cl-section' },
        h('h3', null, ic('info', 14), 'Credits'),
        h('p', { style: 'font-size:13px;color:var(--dim);line-height:1.55;margin:6px 0 0', html: 'AniKuoshi v1.0.8 · RYZISHIN. Streaming metadata and playback provided by <a href="https://api-kuoshi.onrender.com" target="_blank" rel="noopener" style="color:var(--acc);text-decoration:underline">APIKuoshi</a>.' })
      )
    );
    $('#clClose').addEventListener('click', () => Changelog.close());
    this.modal.addEventListener('click', e => { if (e.target === this.modal) Changelog.close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.modal.classList.contains('open')) this.close(); });
  },
  open() { this.modal.classList.add('open'); document.body.style.overflow = 'hidden'; },
  close() { this.modal.classList.remove('open'); document.body.style.overflow = ''; }
};

/* ---------- v1.0.2: Custom confirm dialog ---------- */
const ConfirmDialog = {
  modal: null, titleEl: null, bodyEl: null, actionsEl: null, _resolve: null,
  init() {
    this.modal = $('#confirmModal');
    this.titleEl = $('#cfTitleText');
    this.bodyEl = $('#cfBody');
    this.actionsEl = $('#cfActions');
    const close = (result) => {
      this.modal.classList.remove('open');
      document.body.style.overflow = '';
      if (this._resolve) { this._resolve(result); this._resolve = null; }
    };
    $('#cfClose').addEventListener('click', () => close(false));
    this.modal.addEventListener('click', e => { if (e.target === this.modal) close(false); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.modal.classList.contains('open')) close(false);
      if (e.key === 'Enter' && this.modal.classList.contains('open')) close(true);
    });
  },
  open(opts) {
    opts = opts || {};
    this.titleEl.textContent = opts.title || 'Confirm';
    this.bodyEl.replaceChildren(
      h('p', { text: opts.body || 'Are you sure?' }),
      opts.hint ? h('small', { text: opts.hint }) : null
    );
    this.actionsEl.replaceChildren(
      h('button', { class: 'btn btn--line',
        onclick: () => { this.modal.classList.remove('open'); document.body.style.overflow = ''; if (this._resolve) { this._resolve(false); this._resolve = null; } if (opts.onConfirm) opts.onConfirm(false); }
      }, opts.cancelLabel || 'Cancel'),
      h('button', { class: 'btn ' + (opts.danger ? 'btn--danger' : 'btn--acc'),
        onclick: () => { this.modal.classList.remove('open'); document.body.style.overflow = ''; if (this._resolve) { this._resolve(true); this._resolve = null; } if (opts.onConfirm) opts.onConfirm(true); }
      }, opts.danger ? ic('trash', 14) : null, opts.confirmLabel || 'Confirm')
    );
    this.modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    return new Promise(resolve => { this._resolve = resolve; });
  }
};

/* ---------- v1.0.2: Bookmark dropdown menu ---------- */
const BookmarkMenu = {
  _open: null,
  open(opts) {
    this.close();
    opts = opts || {};
    const anchor = opts.anchor;
    const card = opts.card;
    if (!anchor || !card || !card.key) return;
    const cur = Store.bookmarkStatus(card.key);
    const bmEntry = Store.favs.find(f => f.key === card.key);
    const updatedAgo = bmEntry ? fmtAgo(bmEntry.updatedAt || bmEntry.at || 0) : '';
    const curLabel = cur ? (BOOKMARK_STATUS_BY_ID[cur] || {}).label : '';
    const pop = h('div', { class: 'bm-pop', role: 'menu' },
      h('div', { class: 'bm-hd', text: 'Bookmark as' }),
      cur ? h('div', { class: 'bm-current-hint' },
        h('span', { class: 'bm-dot', style: 'color:' + ((BOOKMARK_STATUS_BY_ID[cur] || {}).color || 'var(--dim)') }),
        h('span', null, h('b', { text: curLabel }), h('span', { text: ' · ' + updatedAgo }))
      ) : null,
      ...BOOKMARK_STATUSES.map(s => {
        const isSel = cur === s.id;
        const item = h('div', { class: 'bm-item' + (isSel ? ' sel' : ''), role: 'menuitemradio', 'aria-checked': isSel ? 'true' : 'false', tabindex: '0' },
          h('span', { class: 'bm-dot', style: 'color:' + s.color }),
          h('span', { class: 'bm-label', text: s.label }),
          h('span', { class: 'bm-check' }, ic('check', 14))
        );
        item.addEventListener('click', () => {
          Store.setBookmark(card, s.id);
          toast('Bookmarked as ' + s.label);
          this.close();
          if (opts.onPick) opts.onPick(s.id);
        });
        item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); } });
        return item;
      }),
      cur ? h('div', { class: 'bm-item bm-remove', role: 'menuitem', tabindex: '0' },
        h('span', { class: 'bm-dot' }),
        h('span', { class: 'bm-label', text: 'Remove bookmark' })
      ) : null
    );
    const rmRow = pop.querySelector('.bm-remove');
    if (rmRow) {
      rmRow.addEventListener('click', () => {
        Store.setBookmark(card, null);
        toast('Removed bookmark');
        this.close();
        if (opts.onPick) opts.onPick(null);
      });
      rmRow.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rmRow.click(); } });
    }
    document.body.append(pop);
    const r = anchor.getBoundingClientRect();
    const pw = pop.offsetWidth;
    const ph = pop.offsetHeight;
    let left = r.right - pw;
    let top = r.bottom + 6;
    if (left < 8) left = 8;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
    pop.style.position = 'fixed';
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.style.zIndex = '300';
    this._open = pop;
    const closeHandler = (e) => {
      if (!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) {
        this.close();
        document.removeEventListener('pointerdown', closeHandler, true);
        window.removeEventListener('scroll', closeHandler, true);
      }
    };
    const escHandler = (e) => {
      if (e.key === 'Escape') { this.close(); document.removeEventListener('keydown', escHandler, true); }
    };
    setTimeout(() => {
      document.addEventListener('pointerdown', closeHandler, true);
      window.addEventListener('scroll', closeHandler, true);
      document.addEventListener('keydown', escHandler, true);
    }, 0);
  },
  close() {
    if (this._open) { this._open.remove(); this._open = null; }
  }
};

/* ---------- Settings panel ---------- */
const Settings = {
  modal: null,
  body: null,
  init() {
    this.modal = $('#settingsModal');
    this.body = $('#setBody');
    $('#setClose').addEventListener('click', () => Settings.close());
    this.modal.addEventListener('click', e => { if (e.target === this.modal) Settings.close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.modal.classList.contains('open')) this.close(); });
  },
  open() {
    this.render();
    this.modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  },
  close() {
    this.modal.classList.remove('open');
    document.body.style.overflow = '';
  },
  /* Re-render a single setting row by key (so the watch view can live-update
     when e.g. accent color or subtitle size changes).                          */
  refreshRow(key) {
    if (!this.modal.classList.contains('open')) return;
    const row = $('[data-row="' + key + '"]', this.body);
    if (!row) return;
    const fresh = this.buildRow(key);
    if (fresh) row.replaceWith(fresh);
  },
  buildRow(key) {
    const s = Store.settings;
    if (key === 'titleLang') {
      return h('div', { class: 'settings-row', dataset: { row: 'titleLang' } },

          )));
    }
    if (key === 'accent') {
      const swatches = [
        { id: 'amber',   color: '#f5a524', label: 'Amber' },
        { id: 'sage',    color: '#4cc38a', label: 'Sage' },
        { id: 'sky',     color: '#7fc0ff', label: 'Sky' },
        { id: 'coral',   color: '#ff8589', label: 'Coral' },
        { id: 'lavender',color: '#c98bff', label: 'Lavender' }
      ];
      return h('div', { class: 'settings-row', dataset: { row: 'accent' } },
        h('div', { class: 'lbl' }, 'Accent color', h('small', null, 'Applies everywhere — including Direct player controls')),
        h('div', { class: 'ctl' },
          h('div', { class: 'swatches' },
            ...swatches.map(sw => h('button', {

              style: 'background:' + sw.color,
              title: sw.label,

              onclick: () => { Store.setSettings({ accent: sw.id }); applyTheme(); this.refreshRow('accent'); this.refreshRow('accentCustom'); }
            })),
            h('label', {
              class: 'swatch custom' + (s.accent === 'custom' ? ' on' : ''),
              title: 'Custom color',
              'aria-label': 'Custom color'
            },
              h('input', {
                type: 'color',
                value: s.accentCustom || '#f5a524',
                onchange: (e) => { Store.setSettings({ accent: 'custom', accentCustom: e.target.value }); applyTheme(); this.refreshRow('accent'); }
              }))
          )));
    }
    if (key === 'skipDuration') {
      return h('div', { class: 'settings-row', dataset: { row: 'skipDuration' } },
        h('div', { class: 'lbl' }, 'Shift+Enter skip', h('small', null, 'Seconds jumped by Shift+Enter in the player')),
        h('div', { class: 'ctl' },
          h('div', { class: 'num-input' },
            h('button', { onclick: () => { const v = Math.max(5, (s.skipDuration || 85) - 5); Store.setSettings({ skipDuration: v }); this.refreshRow('skipDuration'); } }, '\u2212'),
            h('input', { type: 'number', min: '5', max: '300', step: '5', value: String(s.skipDuration || 85),
              onchange: (e) => { const v = Math.max(5, Math.min(300, parseInt(e.target.value, 10) || 85)); Store.setSettings({ skipDuration: v }); applyTheme(); this.refreshRow('skipDuration'); } }),
            h('button', { onclick: () => { const v = Math.min(300, (s.skipDuration || 85) + 5); Store.setSettings({ skipDuration: v }); applyTheme(); this.refreshRow('skipDuration'); } }, '+')),
          h('span', { class: 'val', style: 'min-width:auto;margin-left:6px', text: 's' })));
    }
    if (key === 'subtitleSize') {
      return h('div', { class: 'settings-row', dataset: { row: 'subtitleSize' } },
        h('div', { class: 'lbl' }, 'Subtitle size', h('small', null, 'Direct player only — cue text height in pixels')),
        h('div', { class: 'ctl' },
          h('div', { class: 'range-wrap' },
            h('input', { type: 'range', min: '12', max: '36', step: '1',
              value: String(s.subtitleSize || 18),
              oninput: (e) => { Store.setSettings({ subtitleSize: parseInt(e.target.value, 10) }); applyTheme(); $('.val', e.target.parentElement).textContent = e.target.value + 'px'; } }),
            h('span', { class: 'val', text: (s.subtitleSize || 18) + 'px' }))));
    }
    if (key === 'subtitleBg') {
      return h('div', { class: 'settings-row', dataset: { row: 'subtitleBg' } },
        h('div', { class: 'lbl' }, 'Subtitle background', h('small', null, 'Opacity of the black cue background, 0\u20131')),
        h('div', { class: 'ctl' },
          h('div', { class: 'range-wrap' },
            h('input', { type: 'range', min: '0', max: '1', step: '0.05',
              value: String(s.subtitleBg != null ? s.subtitleBg : 0.65),
              oninput: (e) => { Store.setSettings({ subtitleBg: parseFloat(e.target.value) }); applyTheme(); $('.val', e.target.parentElement).textContent = Math.round(parseFloat(e.target.value) * 100) + '%'; } }),
            h('span', { class: 'val', text: Math.round((s.subtitleBg != null ? s.subtitleBg : 0.65) * 100) + '%' }))));
    }
    /* v1.0.4: Backup & restore */
    if (key === 'backup') {
      return h('div', { class: 'settings-row', dataset: { row: 'backup' } },
        h('div', { class: 'lbl' }, 'Backup data', h('small', null, 'Download all bookmarks, history, progress, and settings as a JSON file')),
        h('div', { class: 'ctl' },
          h('div', { class: 'backup-btns' },
            h('button', { class: 'btn btn--line', style: 'min-height:38px;padding:0 14px;font-size:13px',
              onclick: () => {
                const data = {};
                ['favs','hist','prog','settings','toggles','cc'].forEach(k => {
                  try { data[k] = JSON.parse(localStorage.getItem('anikuoshi:' + k) || 'null'); } catch (e) { }
                });
                data._meta = { app: 'AniKuoshi', version: APP_VERSION, exportedAt: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = h('a', { href: url, download: 'anikuoshi-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
                document.body.append(a); a.click(); a.remove();

            h('button', { class: 'btn btn--line', style: 'min-height:38px;padding:0 14px;font-size:13px',
              onclick: () => {
                const inp = h('input', { type: 'file', accept: 'application/json,.json' });
                inp.style.display = 'none';
                document.body.append(inp);
                inp.addEventListener('change', (e) => {
                  const file = e.target.files && e.target.files[0];
                  if (!file) { inp.remove(); return; }
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                    try {
                      const data = JSON.parse(ev.target.result);
                      if (!data || (data.app !== 'AniKuoshi' && !(data._meta && data._meta.app === 'AniKuoshi'))) {
                        ConfirmDialog.open({ title: 'Invalid file', body: 'This file does not look like an AniKuoshi backup.', confirmLabel: 'OK', cancelLabel: 'Close', danger: true });
                        inp.remove(); return;
                      }
                      ConfirmDialog.open({
                        title: 'Restore backup',
                        body: 'Restore data from "' + file.name + '"?',
                        hint: 'This will OVERWRITE all current bookmarks, history, progress, and settings. The page will reload.',
                        confirmLabel: 'Restore',
                        cancelLabel: 'Cancel',
                        danger: true,
                        onConfirm: (ok) => {
                          if (!ok) { inp.remove(); return; }
                          ['favs','hist','prog','settings','toggles','cc'].forEach(k => {
                            try { if (data[k] != null) localStorage.setItem('anikuoshi:' + k, JSON.stringify(data[k])); } catch (e) { }
                          });
                          toast('Backup restored — reloading');
                          setTimeout(() => location.reload(), 800);
                        }
                      });
                    } catch (err) {
                      toast('Could not read backup file');
                    }
                    inp.remove();
                  };
                  reader.readAsText(file);
                });
                inp.click();
              }
            }, ic('refresh', 14), 'Import')
          )
        )
      );
    }
    /* v1.0.4: Ask-to-resume toggle (re-enable after disabling via the modal checkbox) */
    if (key === 'askResume') {
      const s = Store.settings;
      return h('div', { class: 'settings-row', dataset: { row: 'askResume' } },
        h('div', { class: 'lbl' }, 'Ask to resume', h('small', null, 'Show the "Continue from X" prompt when switching to an episode with saved progress')),
        h('div', { class: 'ctl' },
          h('div', { class: 'seg' },
            h('button', { class: s.askResume !== false ? 'on' : '', onclick: () => { Store.setSettings({ askResume: true }); this.refreshRow('askResume'); } }, 'On'),
            h('button', { class: s.askResume === false ? 'on' : '', onclick: () => { Store.setSettings({ askResume: false }); this.refreshRow('askResume'); } }, 'Off')
          )
        )
      );
    }
    if (key === 'clearCache') {
      return h('div', { class: 'settings-row', dataset: { row: 'clearCache' } },
        h('div', { class: 'lbl' }, 'Clear cache & history', h('small', null, 'Wipes favorites, history, progress, settings, and in-memory cache; reloads the page')),
        h('div', { class: 'ctl' },
          h('button', { class: 'btn btn--danger', style: 'min-height:38px;padding:0 14px;font-size:13px',
            onclick: () => {
              ConfirmDialog.open({
                title: 'Clear all data',
                body: 'Clear ALL local data — favorites, history, progress, settings?',
                hint: 'This cannot be undone. The page will reload after clearing.',
                confirmLabel: 'Clear all',
                cancelLabel: 'Cancel',
                danger: true,
                onConfirm: (ok) => {
                  if (!ok) return;
                  try {
                    ['favs','hist','prog','settings','toggles','kbdhint','cc'].forEach(k => localStorage.removeItem('anikuoshi:' + k));
                  } catch (e) { }
                  MemCache.clear();
                  WatchCore.clearAll();
                  Franchise._rootCache.clear();
                  location.href = '/';
                  location.reload();
                }
              });
            }
          }, ic('trash', 14), 'Clear all')));
    }
    return null;
  },
  render() {
    this.body.replaceChildren(
      h('div', { class: 'settings-section' },
        h('h3', null, ic('palette', 14), 'Appearance'),
        this.buildRow('accent')
      ),
      h('div', { class: 'settings-section' },
        h('h3', null, ic('type', 14), 'Titles'),
        this.buildRow('titleLang')
      ),
      h('div', { class: 'settings-section' },
        h('h3', null, ic('gauge-fast', 14), 'Playback'),
        this.buildRow('skipDuration'),
        this.buildRow('askResume')
      ),
      h('div', { class: 'settings-section' },
        h('h3', null, ic('cc-on', 14), 'Subtitles'),
        this.buildRow('subtitleSize'),
        this.buildRow('subtitleBg')
      ),
      h('div', { class: 'settings-section' },
        h('h3', null, ic('ext', 14), 'Backup'),
        this.buildRow('backup')
      ),
      h('div', { class: 'settings-section' },
        h('h3', null, ic('trash', 14), 'Data'),
        this.buildRow('clearCache')
      )
    );
  }
};
</script>
<script>
/* ================= AniKuoshi v1.0.8 — views: home / search / library ================= */
'use strict';

/* ---------- live suggestions ---------- */
const Suggest = {
  seq: 0,
  normalize(it) {
    if (!it) return null;
    const key = it.key || it.slug || it.animeKey || it.id || '';
    if (!key) return null;
    /* Fold in normalizeEntry so any title_* / english / native / title_english
       variants the API returns are mapped to the canonical field names
       titleMain()/titleSub() expect. */
    const n = normalizeEntry(it);
    return {
      key,
      slug: it.slug || key,
      title: n.titleRomaji || it.title || it.name || '',
      titleRomaji: n.titleRomaji,
      titleEnglish: n.titleEnglish,
      titleNative: n.titleNative,
      poster: n.poster || it.image || it.thumbnail || '',
      type: it.type || '',
      year: it.year || '',
      episodes: it.episodes || it.totalEpisodes || 0,
      dub: it.dub != null ? it.dub : (it.dubCount || 0),
      status: it.status || ''
    };
  },
  attach(input, dropdown, opts) {
    opts = opts || {};
    let items = [];
    let active = -1;
    let timer = 0;
    let lastQ = '';
    const close = () => { dropdown.classList.remove('open'); active = -1; };
    const open = () => {
      /* Compute available vertical space and cap the overlay height so it
         never spills past the viewport. We use a CSS var instead of a fixed
         max-height so the same rule works on tall desktops and short phones. */
      const r = dropdown.parentElement.getBoundingClientRect();
      const top = r.bottom + 8; /* overlay's top will be parent bottom + 8px gap */
      const avail = Math.max(160, window.innerHeight - top - 8);
      dropdown.style.setProperty('--sugg-avail', Math.min(avail, 460) + 'px');
      dropdown.classList.add('open');
    };

    const render = () => {
      if (!items.length) {
        dropdown.replaceChildren(h('div', { class: 'sugg-empty',
          text: lastQ ? 'No titles match "' + lastQ + '"' : 'Type at least two characters' }));
        open(); return;
      }
      dropdown.replaceChildren(
        ...items.map((it, i) => {
          const sub = titleSub(it);
          const row = h('div', { class: 'sugg-item', dataset: { idx: i }, role: 'option' },
            it.poster ? imgOrPh(it.poster, 'sugg-thumb', '', 'film')
                      : h('div', { class: 'sugg-thumb-fallback' }, ic('film')),
            h('div', { class: 'sugg-info' },
              h('div', { class: 'sugg-title', text: bestTitle(it) }),
              sub ? h('div', { class: 'sugg-meta sugg-sub', text: sub }) : null,
              h('div', { class: 'sugg-meta',
                text: [metaLine(it), it.dub > 0 ? 'Dub' : 'Sub only'].filter(Boolean).join(' \u00b7 ') })
            ),
            ic('chev-r')
          );
          row.addEventListener('click', e => pick(it));
          return row;
        }),
        h('div', { class: 'sugg-note' },
          h('span', { class: 'kbd', text: '\u2191\u2193' }), ' navigate  ',
          h('span', { class: 'kbd', text: 'Enter' }), ' open  ',
          h('span', { class: 'kbd', text: 'Esc' }), ' close'
        )
      );
      open();
      markActive();
    };

    const markActive = () => {
      $$('.sugg-item', dropdown).forEach(el => {
        const on = Number(el.dataset.idx) === active;
        if (on) el.setAttribute('data-active', ''); else el.removeAttribute('data-active');
      });
    };

    const pick = it => {
      close();
      input.blur();
      if (opts.onPick) opts.onPick(it);
      else if (it && it.key) go(routeFor(it));
      else toast('Could not open that title');
    };

    const run = async q => {
      lastQ = q;
      const mySeq = ++this.seq;
      let list = [];
      try {
        const j = await API.get('/api/suggestions?keyword=' + enc(q), 45000);
        if (mySeq !== this.seq || (input.value || '').trim() !== q) return;
        list = (j.suggestions || [])
          .map(s => this.normalize(s))
          .filter(Boolean)
          .slice(0, 8);
      } catch (e) { if (mySeq !== this.seq) return; }
      items = list; active = -1;
      render();
    };

    input.addEventListener('input', () => {
      const q = (input.value || '').trim();
      clearTimeout(timer);
      if (q.length < 2) { items = []; close(); return; }
      timer = setTimeout(() => run(q), 230);
    });

    input.addEventListener('keydown', e => {
      /* Enter and Escape fire regardless of whether the dropdown is open —
         so the user doesn't have to wait for suggestions to load before
         their Enter key actually triggers a search. Arrow keys still bail
         when the dropdown is closed (they only make sense when there's a
         list to navigate).                                                    */
      if (e.key === 'Enter') {
        const q = (input.value || '').trim();
        if (active >= 0 && items[active]) { e.preventDefault(); pick(items[active]); }
        else if (q.length >= 2) { e.preventDefault(); close(); opts.onSubmit ? opts.onSubmit(q) : go('/search?q=' + enc(q)); }
        return;
      }
      if (e.key === 'Escape') { close(); return; }
      if (!dropdown.classList.contains('open')) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(items.length - 1, active + 1); markActive(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(-1, active - 1); markActive(); }
    });

    input.addEventListener('focus', () => { if (items.length) open(); });
    /* Recompute overlay height on viewport resize (e.g. mobile URL bar show/hide, rotation) */
    window.addEventListener('resize', () => { if (dropdown.classList.contains('open')) open(); });
    document.addEventListener('pointerdown', e => { if (!dropdown.contains(e.target) && e.target !== input) close(); });
    return { close };
  }
};

/* ---------- search results ---------- */
Views.search = async function (view, my, q, page) {
  Header.sub('Search', { search: true });
  const root = h('div', { class: 'wrap' });
  const input = h('input', { type: 'search', value: q, placeholder: 'Search anime', 'aria-label': 'Search anime', autocomplete: 'off', spellcheck: 'false', enterkeyhint: 'search' });
  const sugg = h('div', { class: 'sugg', role: 'listbox' });
  /* Clear button + Search icon button — visible affordances so the user
     can fire a search by tap/click without depending on suggestions loading. */
  const clearBtn = h('button', { class: 'icbtn', 'aria-label': 'Clear search', style: 'display:none' }, ic('x'));
  clearBtn.addEventListener('click', () => { input.value = ''; input.focus(); clearBtn.style.display = 'none'; });
  input.addEventListener('input', () => { clearBtn.style.display = input.value ? '' : 'none'; });
  const searchBtn = h('button', { class: 'icbtn', 'aria-label': 'Search' }, ic('search'));
  const submit = () => {
    const v = (input.value || '').trim();
    if (v.length >= 2) { go('/search?q=' + enc(v) + '&p=1'); input.blur(); }
    else input.focus();
  };
  searchBtn.addEventListener('click', submit);
  if (q) clearBtn.style.display = '';
  const bar = h('div', { class: 'searchbar', style: 'margin:16px 0 4px' }, ic('search'), input, clearBtn, searchBtn);
  /* Suggest.attach now handles Enter regardless of dropdown-open state,
     so the search fires immediately on Enter — no waiting for suggestions.   */
  Suggest.attach(input, sugg, { onSubmit: nq => { go('/search?q=' + enc(nq) + '&p=1'); input.blur(); } });
  /* Wrap bar+sugg in a .searchwrap so the overlay (absolute) is positioned
     relative to the bar AND inherits the high z-index (.searchwrap has z-index:80). */
  const searchWrap = h('div', { class: 'searchwrap' }, bar, sugg);
  root.append(searchWrap);
  const grid = h('div', { class: 'grid' });
  const gridWrap = h('div', null,
    h('div', { class: 'load-inline' }, h('span', { class: 'dots' }, h('i'), h('i'), h('i')), h('span', { text: 'Searching \u201c' + q + '\u201d' })),
    grid);
  root.append(gridWrap);
  view.replaceChildren(root);
  if (my !== Router.seq) return;
  let data;
  try {
    data = await API.get('/api/search?q=' + enc(q) + '&page=' + page, 4 * 60000);
  } catch (e) {
    if (my !== Router.seq) return;
    gridWrap.replaceChildren(emptyState('alert', 'Search failed', 'Could not reach APIKuoshi. Check your connection and try again.',
      h('button', { class: 'btn btn--line', onclick: () => Router.render() }, ic('refresh'), 'Retry')));
    return;
  }
  if (my !== Router.seq) return;
  const results = data.results || [];
  gridWrap.replaceChildren();
  if (!results.length) {
    gridWrap.append(emptyState('search', 'No results for \u201c' + q + '\u201d', 'Try a different spelling, the romaji title, or a shorter fragment.'));
  } else {
    gridWrap.append(grid);
    grid.replaceChildren(...results.map((r, i) => {
      const c = animeCard(r);
      c.setAttribute('data-aos', 'fade-up');
      c.setAttribute('data-aos-delay', String(Math.min(i * 40, 400)));
      return c;
    }));
    const pager = h('div', { class: 'pager' },
      h('button', { class: 'btn btn--line', disabled: page <= 1 || undefined, onclick: () => go('/search?q=' + enc(q) + '&p=' + (page - 1)) }, ic('back'), 'Prev'),
      h('span', { text: 'Page ' + page }),
      h('button', { class: 'btn btn--line', disabled: !results.length || undefined, onclick: () => go('/search?q=' + enc(q) + '&p=' + (page + 1)) }, 'Next', ic('chev-r'))
    );
    gridWrap.append(pager);
  }
  if (window.AOS) AOS.refresh();
};

/* ---------- library ---------- */
function fmtAgo(ts) {
  const d = Date.now() - (ts || 0);
  if (d < 90e3) return 'just now';
  if (d < 3600e3) return Math.round(d / 60e3) + ' min ago';
  if (d < 86400e3) return Math.round(d / 3600e3) + ' h ago';
  return Math.round(d / 86400e3) + ' d ago';
}

/* v1.0.2: Bookmarks tab — status filter chips + grouped grid + drag-and-drop. */
function renderBookmarksTab(body) {

  if (!all.length) {
    body.append(emptyState('bookmark', 'No bookmarks yet',
      'Tap the bookmark icon on any title to organize it by status — Plan to Watch, Watching, Completed, Paused, or Dropped.',
      h('button', { class: 'btn btn--acc', onclick: () => go('/') }, ic('search'), 'Find something to watch')));
    return;
  }
  const counts = Object.fromEntries(BOOKMARK_STATUSES.map(s => [s.id, 0]));
  for (const f of all) { if (counts[f.status] != null) counts[f.status]++; }
  const total = all.length;
  const filter = Store.settings.libraryBmFilter || 'all';
  const chipRow = h('div', { class: 'bm-filter-row' });
  const allChip = h('button', {
    class: 'bm-filter-chip' + (filter === 'all' ? ' on' : ''),
    onclick: () => { Store.setSettings({ libraryBmFilter: 'all' }); Router.render(); }
  }, h('span', { class: 'bm-dot', style: 'color:var(--acc)' }), 'All', h('span', { class: 'bm-count', text: String(total) }));
  chipRow.append(allChip);
  for (const s of BOOKMARK_STATUSES) {
    if (counts[s.id] === 0) continue;
    const chip = h('button', {
      class: 'bm-filter-chip status-' + s.id + (filter === s.id ? ' on' : ''),
      onclick: () => { Store.setSettings({ libraryBmFilter: s.id }); Router.render(); }
    }, h('span', { class: 'bm-dot', style: 'color:' + s.color }), s.label, h('span', { class: 'bm-count', text: String(counts[s.id]) }));
    chipRow.append(chip);
  }
  body.append(chipRow);
  const statusesToShow = filter === 'all'
    ? BOOKMARK_STATUSES.filter(s => counts[s.id] > 0)
    : BOOKMARK_STATUSES.filter(s => s.id === filter);
  if (!statusesToShow.length) {
    body.append(emptyState('bookmark', 'No bookmarks in "' + (BOOKMARK_STATUS_BY_ID[filter] || { label: filter }).label + '"',
      'Pick a different status filter, or bookmark more titles.',
      h('button', { class: 'btn btn--line', onclick: () => { Store.setSettings({ libraryBmFilter: 'all' }); Router.render(); } }, ic('back', 14), 'Show all')));
    return;
  }
  for (const s of statusesToShow) {
    const entries = all.filter(f => f.status === s.id);
    const hasManualOrder = entries.some(f => f.order != null);
    entries.sort((a, b) => {
      if (hasManualOrder) {
        const oa = a.order != null ? a.order : 9999;
        const ob = b.order != null ? b.order : 9999;
        if (oa !== ob) return oa - ob;
      }
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    if (!entries.length) continue;
    const groupHd = h('div', { class: 'bm-group-hd', style: 'color:' + s.color },
      h('span', { class: 'bm-dot' }),
      h('span', { text: s.label }),
      h('span', { class: 'bm-count', text: entries.length + (entries.length === 1 ? ' title' : ' titles') })
    );
    body.append(groupHd);
    const grid = h('div', { class: 'grid bm-grid', dataset: { status: s.id } });
    for (const f of entries) {
      const c = animeCard(f);

      c.append(agoLine);

        'aria-label': 'Change bookmark status',
        title: 'Bookmark'
      }, ic(s.icon, 14));
      bmToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        BookmarkMenu.open({
          anchor: bmToggle,
          card: f,
          onPick: () => Router.render()
        });
      });
      $('.hposter', c).append(bmToggle);
      grid.append(c);
    }
    wireBookmarkDnD(grid, s.id);
    body.append(grid);
  }

/* v1.0.3: Drag-and-drop reordering for bookmark cards. */
function wireBookmarkDnD(grid, status) {
  let dragged = null;
  let touchStartY = 0, touchStartX = 0;
  let touchActive = false;
  const cards = () => Array.from(grid.querySelectorAll('.hcard[data-bm-key]'));
  grid.addEventListener('dragstart', (e) => {
    const card = e.target.closest('.hcard[data-bm-key]');
    if (!card) return;
    dragged = card;
    card.classList.add('bm-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', card.dataset.bmKey); } catch (err) { }
  });
  grid.addEventListener('dragend', () => {
    if (dragged) dragged.classList.remove('bm-dragging');
    dragged = null;
    cards().forEach(c => c.classList.remove('bm-drop-target'));
  });
  grid.addEventListener('dragover', (e) => {
    if (!dragged) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const over = e.target.closest('.hcard[data-bm-key]');
    cards().forEach(c => c.classList.toggle('bm-drop-target', c === over && c !== dragged));
  });
  grid.addEventListener('dragleave', (e) => {
    const over = e.target.closest('.hcard[data-bm-key]');
    if (over) over.classList.remove('bm-drop-target');
  });
  grid.addEventListener('drop', (e) => {
    if (!dragged) return;
    e.preventDefault();
    const target = e.target.closest('.hcard[data-bm-key]');
    if (!target || target === dragged) return;
    const ordered = cards();
    const fromIdx = ordered.indexOf(dragged);
    const toIdx = ordered.indexOf(target);
    if (fromIdx < 0 || toIdx < 0) return;
    ordered.splice(fromIdx, 1);
    ordered.splice(toIdx, 0, dragged);

    ordered.forEach(c => { grid.append(c); c.classList.remove('bm-drop-target'); });
    toast('Reordered');

  grid.addEventListener('touchstart', (e) => {
    const card = e.target.closest('.hcard[data-bm-key]');
    if (!card || e.target.closest('.bm-toggle')) return;
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchActive = false;
    const timer = setTimeout(() => {
      touchActive = true; dragged = card; card.classList.add('bm-dragging');

    const cancel = () => { clearTimeout(timer); grid.removeEventListener('touchmove', cm); grid.removeEventListener('touchend', ce); };

      const t2 = ev.touches[0];

    grid.addEventListener('touchend', ce, { passive: true });

    if (!touchActive || !dragged) return;
    e.preventDefault();
    const t = e.touches[0];

    cards().forEach(c => c.classList.toggle('bm-drop-target', c === over && c !== dragged));
  }, { passive: false });
  grid.addEventListener('touchend', (e) => {
    if (!touchActive || !dragged) { touchActive = false; dragged = null; return; }
    const t = e.changedTouches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const target = el && el.closest('.hcard[data-bm-key]');
    if (target && target !== dragged) {
      const ordered = cards();
      const fromIdx = ordered.indexOf(dragged);
      const toIdx = ordered.indexOf(target);

    }
    if (dragged) dragged.classList.remove('bm-dragging');
    cards().forEach(c => c.classList.remove('bm-drop-target'));
    touchActive = false; dragged = null;
  });

      .then(j => {
        const recs = (j.recommendations || []).filter(r => r && r.key);
        if (!recs.length || !alive()) return;
        secRecs.fill(recs.map(r => animeCard(r)));

  /* =============== STAGE 3 — UPGRADE TO FRANCHISE DATA WHEN IT LANDS ===============

    box.addEventListener('pointerdown', e => {
      if (P.state.mode !== 'direct' || P.destroyed) return;
      if (e.target.closest('.pctl') || e.target.closest('.ptop') || e.target.closest('.skipbtn') || e.target.closest('.pcpop') || e.target.closest('.cp-btn')) return;

    box.addEventListener('pointerleave', cancelLongPress);
    box.addEventListener('pointercancel', cancelLongPress);

    box.addEventListener('pointerup', e => {
      if (P.state.mode !== 'direct' || P.destroyed) return;
      if (longPressActive) { cancelLongPress(); return; }

          if (P.lastTap && now === P.lastTap) {

      }

      if (isTouch || e.target === P.video || e.target === box || (e.target.classList && e.target.classList.contains('vign'))) {

  function buildCcMenu() {

      const it = h('div', { class: 'popitem' + (i === showingIdx ? ' sel' : '') }, ic('check'), label);

    if (!list.length) { toast('No subtitle tracks'); return; }

    setNav(hasPrev, hasNext) {

      /* v1.0.5: Only show resume modal if there's ACTUAL progress (pos >= 20s

      let savedProg = null;
      try { savedProg = Store.getProg(key, String(ep)); } catch (e) { savedProg = null; }
      const hasRealProgress = savedProg && savedProg.pos >= 20 && savedProg.dur > 1 && savedProg.pos < savedProg.dur * 0.96;

      return WatchCore.resolve(key, ep, prov, type, {}).then(entry => {
        if (P.destroyed || myGen !== P._switchGen) return;  /* v1.0.5: stale — user switched away */
        if (showResumeModal && dom.resume) {

      let savedProg = null;
      try { savedProg = Store.getProg(key, String(ep)); } catch (e) { savedProg = null; }
      const hasRealProgress = savedProg && savedProg.pos >= 20 && savedProg.dur > 1 && savedProg.pos < savedProg.dur * 0.96;

      if (P.state.mode === 'direct' && P.video) P.lastDirectTime = P.video.currentTime || P.lastDirectTime;
      P.resumeAt = P.lastDirectTime || P.resumeAt;
      /* v1.0.8: Show the loader IMMEDIATELY with a clear "Switching to X mode"
         message, BEFORE clearing media. This prevents the black screen flash
         that happened between clearMedia() and the new stream loading. */
      showLoad(mode === 'embed' ? 'Switching to embed' : 'Switching to direct');

        if (age > 75000) {

            .then(en => { if (!P.destroyed && myGen === P._switchGen) load(en, { mode: 'direct' }); }).catch(() => { });
        } else load(P.state.entry, { mode: 'direct' });
        return;
      }
      /* v1.0.8: If we get here, the requested mode isn't available. Hide the
         loader before showing the toast so it doesn't linger forever. */
      hideLoad();
      toast('That mode is unavailable for this server');
    },
    saveNow(pos, dur) { ui.onProgress(pos, dur, true); },
    destroy() {
      P.destroyed = true;
      clearTimeout(P.watchdog); clearTimeout(P.controlsTimer);
      clearInterval(P._subGuard);
      if (P._docDown) { document.removeEventListener('pointerdown', P._docDown); P._docDown = null; }
      try { if (P.video) { P.video.pause(); } } catch (e) { }

<script>
/* ================= AniKuoshi v1.0.8 — watch view ================= */
'use strict';

Views.watch = async function (view, my, key, epRaw) {
  let ep = String(parseInt(epRaw, 10) || 1);
  const uiState = { anime: null, entry: null, episodes: [], epObj: null, title: '' };

  Header.sub('Loading', { search: true });
  const playerWrap = h('div', { class: 'player-wrap', id: 'playerWrap' });
  const box = h('div', { id: 'playerBox' });
  playerWrap.append(box);
  const main = h('div', { class: 'wrap' });
  view.replaceChildren(playerWrap, main);

  const toggles = Store.getToggles();

  const player = createPlayer(box, {
    title: () => uiState.title ? uiState.title + (uiState.anime && Number(uiState.anime.episodes) !== 1 ? ' \u00b7 EP ' + ep : '') : 'AniKuoshi',
    onBack: () => Router.back(),
    onPrev: () => changeEpisode(epByOffset(-1)),
    onNext: () => changeEpisode(epByOffset(1)),
    hasNext: () => !!epByOffset(1),
    hasPrev: () => !!epByOffset(-1),
    peekNext: () => epByOffset(1),
    onServerPick: (prov, type) => {
      Store.setSettings({ prov, type });
      const resumeAt = player.video() ? player.video().currentTime : (player.state.lastDirectTime || 0);
      player.switchServer(prov, type, resumeAt).then(entry => {
        if (entry && my === Router.seq) { uiState.entry = entry; renderServers(entry); renderModeChips(); }
      });
    },
    onModeUI: mode => {
      renderModeChips(mode);
      const w = document.getElementById('playerWrap');
      if (w) w.classList.toggle('embed-wrap', mode === 'embed');
    },
    onProgress: (pos, dur, immediate) => saveProgress(pos, dur, immediate)
  });
  Router.cleanup = () => {
    try { const v = player.video(); if (v && v.currentTime && !v.paused) saveProgress(v.currentTime, v.duration || 0, true); } catch (e) { }
    player.destroy();
    WatchCore.clearAll();
    document.removeEventListener('keydown', onKey);
  };

  function epByOffset(dir) {
    const list = uiState.episodes;
    if (!list.length) return null;
    const idx = list.findIndex(e => Number(e.number) === Number(ep));
    return idx >= 0 ? list[idx + dir] || null : null;
  }
  function saveProgress(pos, dur, immediate) {
    if (!uiState.anime) return;
    Store.setProg(key, ep, pos, dur);
    /* v1.0.4: Auto-mark Completed when finishing the last episode. */
    if (dur && pos >= dur * 0.96) {
      /* Check if this is the last episode */
      const list = uiState.episodes;
      const isLast = list.length > 0 && Number(ep) === Number(list[list.length - 1].number);
      if (isLast) {
        const curStatus = Store.bookmarkStatus(key);
        if (curStatus === 'watching') {
          /* Build a minimal card so setBookmark has the fields it needs */
          const a = uiState.anime;
          const card = { key, slug: a.slug, title: bestTitle(a), poster: a.poster, type: a.type, year: a.year };
          Store.setBookmark(card, 'completed');
          toast('Marked as Completed');
        }
      }
    }
    Store.upsertHist({
      key, slug: uiState.anime.slug, title: bestTitle(uiState.anime), poster: uiState.anime.poster,
      thumb: uiState.epObj && uiState.epObj.thumbnail, epTitle: uiState.epObj && uiState.epObj.title,
      ep: Number(ep), pos: Math.floor(pos || 0), dur: Math.floor(dur || 0), type: uiState.anime.type, year: uiState.anime.year
    });
    if (immediate) updateEpCardProgress();
  }
  function updateEpCardProgress() {
    const card = $('.ep-card-sm[data-ep="' + ep + '"]', main);
    if (!card) return;
    const p = Store.getProg(key, ep);
    const bar = $('.ep-prog', card);
    const pct = p && p.dur ? Math.min(100, Math.round((p.pos / p.dur) * 100)) : 0;
    if (bar) { bar.style.display = pct ? '' : 'none'; $('i', bar).style.width = pct + '%'; }
    if (pct >= 96) {
      let fin = $('.ep-finish', card);
      if (!fin) { fin = h('span', { class: 'ep-finish', text: 'Finished' }); card.querySelector('.epthumb').append(fin); }
    }
  }

  /* ---------- in-place episode switch (preserves fullscreen, no re-render) ---------- */
  function changeEpisode(target) {
    if (!target) { toast('No next episode yet'); return; }
    const newEp = String(target.number);
    if (newEp === ep) return;
    const oldEp = ep;
    ep = newEp;
    /* Update URL silently so popstate doesn't trigger a full re-render */
    const newPath = '/watch/' + routeKey(uiState.anime || { slug: key, key: key }) + '/' + newEp;
    Router.replacePathSilent(newPath);
    /* Save current progress before switching */
    try {
      const v = player.video();
      if (v && v.currentTime) saveProgress(v.currentTime, v.duration || 0, true);
    } catch (e) { }
    /* Reload stream in same player (keeps fullscreen) */
    const prog = Store.getProg(key, newEp);
    const resumeAt = prog && prog.pos >= 20 && (!prog.dur || prog.pos < prog.dur * 0.96) ? prog.pos : 0;
    uiState.epObj = uiState.episodes.find(e => Number(e.number) === Number(newEp)) || null;
    const epName = (uiState.epObj && uiState.epObj.title) || ('Episode ' + newEp);
    player.setTop(
      uiState.title +
      ((uiState.anime && ((uiState.anime.type || '').toUpperCase() === 'MOVIE' || Number(uiState.anime.episodes) === 1))
        ? '' : ' \u00b7 Episode ' + newEp + ' \u00b7 ' + epName)
    );
    /* Update prev/next state */
    btnPrevEp.disabled = !epByOffset(-1) || undefined;
    btnNextEp.disabled = !epByOffset(1) || undefined;
    player.setNav(!!epByOffset(-1), !!epByOffset(1));
    /* v1.0.7: Re-render the episode page so the new episode's card is visible.
       If the new episode is on a different page, the old page's cards are
       replaced with the new page's cards. If filtering is active, re-render
       within the filtered list instead. */
    if (typeof renderEpPage === 'function' && typeof pageOfEpisode === 'function') {
      const list = epFilterResults || episodes || [];
      if (list.length) {
        const newPage = pageOfEpisode(list, newEp);
        if (epFilterResults) epFilterPage = newPage; else epCurrentPage = newPage;
        renderEpPage(list, newPage);
      }

      $$('.ep-card-sm', main).forEach(c => {
        c.classList.toggle('cur', c.dataset.ep === newEp);

      if (curCard) curCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
    /* Update EP badge */
    if (epBadgeEl && !isSingle) epBadgeEl.textContent = 'EP ' + newEp;
    /* Reload the stream */
    player.switchEpisode(key, newEp, Store.settings.prov || null, Store.settings.type || null, resumeAt).then(entry => {
      if (entry && my === Router.seq) renderServers(entry);
    });
    document.title = (uiState.title ? uiState.title + ' \u00b7 EP ' + newEp + ' \u00b7 ' : '') + 'AniKuoshi';
  }

  /* ---------- server + mode UI ---------- */
  let srvBox = null, modeChips = null, chipDirect = null, chipEmbed = null, epBadgeEl = null;
  function renderModeChips(force) {
    const entry = uiState.entry;
    if (!entry || !modeChips) return;
    const st = entry.stream;
    const mode = force || P_mode();
    chipDirect.classList.toggle('on', mode === 'direct');
    chipEmbed.classList.toggle('on', mode === 'embed');
    chipDirect.disabled = !hasDirect(st) || undefined;
    chipEmbed.disabled = !hasEmbed(st) || undefined;
  }
  function P_mode() {
    return player.state.mode || 'direct';
  }
  function renderServers(entry) {
    if (!srvBox) return;
    uiState.entry = entry;
    const uniq = [], seen = new Set();
    for (const s of (entry.all || [])) {
      const k = s.provider + '|' + s.type;
      if (!seen.has(k) && (hasDirect(s) || hasEmbed(s))) { seen.add(k); uniq.push(s); }
    }
    const groups = [
      { label: 'Sub', list: uniq.filter(s => (s.type || 'sub') === 'sub') },
      { label: 'Dub', list: uniq.filter(s => s.type === 'dub') }
    ];
    /* Determine the "best" server (the one APIKuoshi's chain resolved as `best`)
       so we can show a green dot on it. Failed probes get a red dot.            */
    const bestStream = entry.data && entry.data.best;
    srvBox.replaceChildren();
    for (const g of groups) {
      if (!g.list.length) continue;
      srvBox.append(h('span', { class: 'lbl', text: g.label }));
      const row = h('div', { class: 'srvrow-compact' });
      for (const s of g.list) {
        const active = s.provider === entry.stream.provider && (s.type || 'sub') === (entry.stream.type || 'sub');
        const isBest = bestStream && bestStream.provider === s.provider && (bestStream.type || 'sub') === (s.type || 'sub');
        const probeFailed = s.probe && s.probe.playable === false;
        let healthClass = '';
        if (isBest) healthClass = 'best';
        else if (probeFailed) healthClass = 'warn';
        const chip = h('button', { class: 'srv-chip-sm' + (g.label === 'Dub' ? ' dub' : '') + (active ? ' on' : '') },
          h('b', { text: (s.provider || '?').charAt(0).toUpperCase() + (s.provider || '').slice(1) }),
          h('span', { class: 'srv-health ' + healthClass, title: isBest ? 'Probed best' : probeFailed ? 'Probe failed' : '' })
        );
        chip.addEventListener('click', () => {
          if (active) return;
          Store.setSettings({ prov: s.provider, type: s.type || 'sub' });
          const resumeAt = player.video() ? player.video().currentTime : (player.state.lastDirectTime || 0);
          player.switchServer(s.provider, s.type || 'sub', resumeAt).then(en => {
            if (en && my === Router.seq) { renderServers(en); renderModeChips(); }
          });
        });
        row.append(chip);
      }
      srvBox.append(row);
    }
    renderModeChips();
  }

  /* ---------- keyboard (Direct mode controls + mode-agnostic episode nav) ---------- */
  const onKey = e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (box.querySelector('.endcard.show') || box.querySelector('.perr.show') || box.querySelector('.resume-modal.show')) return;

    /* Mode-agnostic: episode nav works in Direct AND Embed mode (it happens
       at the app level, not inside the iframe — so the iframe owning playback
       doesn't matter for N/P).                                          */
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      const n = epByOffset(1); if (n) changeEpisode(n);
      else toast('No next episode');
      return;
    }
    if (e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      const p = epByOffset(-1); if (p) changeEpisode(p);
      else toast('No previous episode');
      return;
    }

    /* Everything below requires Direct mode (needs a <video> element) */
    if (player.state.mode !== 'direct') return;
    const v = player.video();
    if (!v) return;
    const popsOpen = box.querySelector('.pcpop.open');
    const shift = e.shiftKey;
    /* Shift+Enter — skip forward by configured duration (default 85s) */
    if (e.key === 'Enter' && shift) {
      e.preventDefault();
      const dur = Store.settings.skipDuration || 85;
      seekPub(dur);
      toast('+' + dur + 's');
      return;
    }
    switch (e.key) {
      case ' ': case 'k': e.preventDefault(); if (popsOpen) return; v.paused ? v.play().catch(() => { }) : v.pause(); break;
      case 'ArrowLeft':  e.preventDefault(); seekPub(shift ? -60 : -5); break;
      case 'ArrowRight': e.preventDefault(); seekPub(shift ?  60 :  5); break;
      case 'j': seekPub(-10); break;
      case 'l': seekPub(10); break;
      case ',': seekPub(-1/30); break;  /* frame step backward */
      case '.': seekPub( 1/30); break;  /* frame step forward */
      case 'ArrowUp': e.preventDefault(); v.muted = false; v.volume = Math.min(1, v.volume + 0.05); break;
      case 'ArrowDown': e.preventDefault(); v.volume = Math.max(0, v.volume - 0.05); break;
      case 'm': v.muted = !v.muted; break;
      case 'f': {
        if (player.state.mode === 'embed') break;
        toggleFullscreenPub();
        break;
      }
      case 'c': player.cycleSubs(); break;
      case 'Enter': {
        /* Trigger whichever skip button is currently visible (like YT skip ads) */
        const skipOutro = box.querySelector('.skip-outro.show');
        const skipOpen  = box.querySelector('.skipbtn.show:not(.skip-outro)');
        if (skipOutro) { e.preventDefault(); skipOutro.click(); }
        else if (skipOpen) { e.preventDefault(); skipOpen.click(); }
        break;
      }
      case 'Escape': box.querySelectorAll('.pcpop.open').forEach(p => p.classList.remove('open')); break;
      default:
        /* 0-9 jump to N×10% of duration */
        if (e.key >= '0' && e.key <= '9' && v.duration) {
          e.preventDefault();
          v.currentTime = (parseInt(e.key, 10) / 10) * v.duration;
          toast('Jumped to ' + (parseInt(e.key, 10) * 10) + '%');
        }
        break;
    }
  };
  function seekPub(s) {
    const v = player.video(); if (!v) return;
    v.currentTime = Math.max(0, Math.min((v.duration || 1e9) - .5, v.currentTime + s));
  }
  function toggleFullscreenPub() {
    const target = player.box.parentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { const r = exit.call(document); if (r && r.catch) r.catch(() => { }); }
    } else {
      const req = target.requestFullscreen || target.webkitRequestFullscreen;
      if (req) { try { const r = req.call(target); if (r && r.catch) r.catch(() => { }); } catch (err) { console.warn('Fullscreen:', err.message); } }
    }
  }
  document.addEventListener('keydown', onKey);

  /* ---------- data ---------- */
  let anime = null;
  try {
    anime = (await API.get(animeUrl(key), 10 * 60000)).anime;
  } catch (e) { anime = null; }
  if (my !== Router.seq) { player.destroy(); return; }
  uiState.anime = anime;
  uiState.title = anime ? bestTitle(anime) : key;
  Header.sub(uiState.title, { search: true });

  /* v1.0.2: Mark this episode as "currently watching" IMMEDIATELY so the
     Continue Watching shelf on / reflects it. Previously the entry was only
     added when saveProgress() fired, which never happens in Embed mode. */
  if (anime) {
    Store.upsertHist({
      key, slug: anime.slug, title: bestTitle(anime), poster: anime.poster,

      ep: Number(ep), pos: 0, dur: 0, type: anime.type, year: anime.year

  const entryPromise = player.open(key, ep, Store.settings.prov || null, Store.settings.type || null,

  chipDirect = h('button', { class: 'chip', onclick: () => player.setMode('direct') }, ic('play', 15), 'Direct');
  chipEmbed = h('button', { class: 'chip', onclick: () => player.setMode('embed') }, ic('ext', 15), 'Embed');
  modeChips = h('div', { class: 'modegrp' }, chipDirect, chipEmbed);

  /* v1.0.5: Toggle labels — long on desktop, short on mobile via data-short attr.

  const togAutoNext = h('button', { class: 'toggle-chip' + (toggles.autoNext ? ' on' : ''), title: 'Auto-next', dataset: { short: 'Next' } }, ic('autonext', 14), 'Auto-next');
  const togAutoSkip = h('button', { class: 'toggle-chip' + (toggles.autoSkip ? ' on' : ''), title: 'Auto-skip Opening', dataset: { short: 'Skip OP' } }, ic('skip', 14), 'Auto-skip OP');
  const togAutoSkipOutro = h('button', { class: 'toggle-chip' + (Store.settings.autoSkipOutro ? ' on' : ''), title: 'Auto-skip Outro', dataset: { short: 'Skip ED' } }, ic('skip', 14), 'Auto-skip ED');
  const togAutoPlay = h('button', { class: 'toggle-chip' + (toggles.autoPlay ? ' on' : ''), title: 'Auto-play', dataset: { short: 'Play' } }, ic('autoplay', 14), 'Auto-play');

  const btnPrevEp = h('button', { class: 'btn btn--line', style: 'min-height:40px;padding:0 14px;font-size:13px', onclick: () => changeEpisode(epByOffset(-1)) }, ic('prev', 16), 'Prev');
  const btnNextEp = h('button', { class: 'btn btn--line', style: 'min-height:40px;padding:0 14px;font-size:13px', onclick: () => changeEpisode(epByOffset(1)) }, 'Next', ic('next', 16));

  srvBox = h('div', { class: 'wctl-row', style: 'display:block' });
  const toggleRow = h('div', { class: 'watch-toggles' }, togAutoNext, togAutoSkip, togAutoSkipOutro, togAutoPlay);
  epBadgeEl = h('span', { class: 'badge', text: 'EP ' + ep });
  const ctlWrap = h('div', null,
    h('div', { class: 'wctl-row' },
      isSingle ? h('span', { class: 'badge badge--acc' }, ic('film', 12), ' Movie') : epBadgeEl,
      h('span', { style: 'flex:1' }),
      isSingle ? null : btnPrevEp,

  main.append(ctlWrap);

  const kbdHint = h('div', { class: 'kbd-hint', id: 'kbdHint' },
    ic('kbd', 14),
    h('span', null, h('span', { class: 'kbd', text: 'Space' }), ' play/pause'),
    h('span', null, h('span', { class: 'kbd', text: 'J/L' }), ' seek 10s'),
    h('span', null, h('span', { class: 'kbd', text: 'Enter' }), ' skip intro/outro'),
    h('span', null, h('span', { class: 'kbd', text: '\u21E7+Enter' }), ' skip ' + (Store.settings.skipDuration || 85) + 's'),

    h('span', null, h('span', { class: 'kbd', text: 'N/P' }), ' next/prev (works in Embed too)'),
    h('span', { class: 'dismiss', onclick: () => { localStorage.setItem('anikuoshi:kbdhint','1'); kbdHint.remove(); } }, 'Dismiss'));
  if (!localStorage.getItem('anikuoshi:kbdhint')) main.append(kbdHint);

  /* ---------- episodes ---------- */
  /* v1.0.7: Reverted to horizontal scroll (removed the wrapping grid).
     For shows with >25 episodes, paginate 25 per page with prev/next page
     buttons. The filter searches across ALL episodes (not just the current
     page) and shows matching results in the same horizontal row.            */
  const EP_PAGE_SIZE = 25;
  let epCurrentPage = 0;       /* 0-indexed page number for the full list */
  let epFilterResults = null;  /* null = not filtering; array = filtered list */
  let epFilterPage = 0;        /* page number when filtering */

  const epFilterInput = h('input', { type: 'search', class: 'ep-filter-input', placeholder: 'Filter episodes', 'aria-label': 'Filter episodes by number or title', enterkeyhint: 'search', autocomplete: 'off' });
  const epListContainer = h('div', { class: 'ep-row' });
  const epPagination = h('div', { class: 'ep-pagination' });
  const epSec = h('section', { class: 'sec', 'data-aos': 'fade-up' },
    h('h2', null, ic('tv'), 'Episodes', h('span', { class: 'sub', style: 'font-size:12px;color:var(--faint);font-weight:400;margin-left:auto', text: '' }), epFilterInput),
    epListContainer,
    epPagination);
  const epCountEl = $('.sub', epSec);
  if (isSingle) epSec.style.display = 'none';

  main.append(epSec);

  let episodes = [];
  /* v1.0.7: The API now handles long shows (enhanced to avoid timeouts).
     Keep a 60s timeout as a safety net — the synthetic fallback from v1.0.6
     is kept as a last resort if the API still fails for edge cases. */
  const EP_TIMEOUT = 60 * 1000;
  try {
    const j = await API.get(episodesUrl(key), EP_TIMEOUT);
    if (my !== Router.seq) return;
    episodes = (j.episodes || []).slice().sort((a, b) => Number(a.number) - Number(b.number));
  } catch (e) { episodes = []; }

  /* v1.0.6 fallback (kept): build synthetic episode list if the API failed. */
  if (!episodes.length && anime) {
    let epCount = 0;
    const epsField = anime.episodes;
    if (typeof epsField === 'number' && epsField > 0) {
      epCount = epsField;
    } else if (typeof epsField === 'string') {
      const m = epsField.match(/(\d+)/);
      if (m) epCount = parseInt(m[1], 10);
    }
    if (!epCount && anime.nextAiringEpisode && anime.nextAiringEpisode.episode) {
      epCount = anime.nextAiringEpisode.episode - 1;
    }
    if (!epCount || epCount < 1) epCount = 12;
    if (epCount > 2000) epCount = 2000;
    episodes = [];
    for (let i = 1; i <= epCount; i++) {
      episodes.push({ number: i, title: null, thumbnail: null, _synthetic: true });
    }
    if (episodes.length) {
      setTimeout(() => toast('Episode list unavailable \u2014 showing ' + epCount + ' episodes without titles'), 500);
    }
  }
  uiState.episodes = episodes;
  uiState.epObj = episodes.find(e => Number(e.number) === Number(ep)) || null;

  const epName = (uiState.epObj && uiState.epObj.title) || ('Episode ' + ep);
  player.setTop(
    uiState.title +
    ((anime && ((anime.type || '').toUpperCase() === 'MOVIE' || Number(anime.episodes) === 1))
      ? '' : ' \u00b7 Episode ' + ep + ' \u00b7 ' + epName)
  );
  btnPrevEp.disabled = !epByOffset(-1) || undefined;
  btnNextEp.disabled = !epByOffset(1) || undefined;
  player.setNav(!!epByOffset(-1), !!epByOffset(1));

  if (episodes.length) epCountEl.textContent = episodes.length + ' episodes';

  /* v1.0.7: Build a card for a single episode (shared between page renders). */
  function buildEpCard(eo) {
    const cur = Number(eo.number) === Number(ep);
    const p = Store.getProg(key, String(eo.number));
    const pct = p && p.dur ? Math.min(100, Math.round((p.pos / p.dur) * 100)) : 0;
    const finished = pct >= 96;
    const card = h('div', { class: 'ep-card-sm' + (cur ? ' cur' : ''), dataset: { ep: eo.number }, tabindex: '0', role: 'button' },
      h('div', { class: 'epthumb' },
        imgOrPh(eo.thumbnail, '', eo.title || ('Episode ' + eo.number), 'film'),
        h('span', { class: 'epnum', text: 'EP ' + eo.number }),
        finished ? h('span', { class: 'ep-finish', text: 'Finished' }) : null,
        h('div', { class: 'ep-prog', style: 'display:' + (pct && !finished ? '' : 'none') }, h('i', { style: 'width:' + pct + '%' }))),
      h('div', { class: 'epname', text: eo.title || 'Episode ' + eo.number }));
    const openEp = () => changeEpisode(eo);
    card.addEventListener('click', openEp);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEp(); } });
    return card;
  }

  /* v1.0.7: Render a page of episodes into the horizontal row. */
  function renderEpPage(list, page) {
    const total = list.length;
    const totalPages = Math.max(1, Math.ceil(total / EP_PAGE_SIZE));
    if (page < 0) page = 0;
    if (page >= totalPages) page = totalPages - 1;
    const start = page * EP_PAGE_SIZE;
    const slice = list.slice(start, start + EP_PAGE_SIZE);

    epListContainer.replaceChildren(...slice.map(buildEpCard));

    const curCard = $('.ep-card-sm.cur', epListContainer);
    if (curCard) {
      requestAnimationFrame(() => {
        curCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    }

    epPagination.replaceChildren();
    if (totalPages > 1) {
      const prevBtn = h('button', { class: 'ep-page-btn', disabled: page === 0 || undefined, onclick: () => {
        const newPage = page - 1;
        if (epFilterResults) epFilterPage = newPage; else epCurrentPage = newPage;
        renderEpPage(list, newPage);
      } }, ic('chev-r', 14), 'Prev');
      prevBtn.querySelector('svg').style.transform = 'scaleX(-1)';
      const info = h('span', { class: 'ep-page-info', text: (start + 1) + '\u2013' + Math.min(start + EP_PAGE_SIZE, total) + ' of ' + total });
      const nextBtn = h('button', { class: 'ep-page-btn', disabled: page >= totalPages - 1 || undefined, onclick: () => {
        const newPage = page + 1;
        if (epFilterResults) epFilterPage = newPage; else epCurrentPage = newPage;
        renderEpPage(list, newPage);
      } }, 'Next', ic('chev-r', 14));
      epPagination.append(prevBtn, info, nextBtn);
    }
  }

  function pageOfEpisode(list, epNum) {
    const idx = list.findIndex(eo => Number(eo.number) === Number(epNum));
    if (idx < 0) return 0;
    return Math.floor(idx / EP_PAGE_SIZE);
  }

  if (!isSingle) {
    if (!episodes.length) {
      epListContainer.replaceChildren(h('div', { class: 'eplist-note', text: 'Episode names could not be loaded \u2014 navigation still works with Prev / Next.' }));
    } else {
      epCurrentPage = pageOfEpisode(episodes, ep);
      renderEpPage(episodes, epCurrentPage);

      let filterTimer = 0;
      epFilterInput.addEventListener('input', () => {
        clearTimeout(filterTimer);
        filterTimer = setTimeout(() => {
          const q = (epFilterInput.value || '').trim().toLowerCase();
          if (!q) {
            epFilterResults = null;
            epFilterPage = 0;
            epCurrentPage = pageOfEpisode(episodes, ep);
            renderEpPage(episodes, epCurrentPage);
            return;
          }
          const filtered = episodes.filter(eo => {
            const numStr = String(eo.number);
            const title = (eo.title || '').toLowerCase();
            if (numStr.includes(q)) return true;
            if (title.includes(q)) return true;
            return false;
          });
          if (!filtered.length) {
            const pureNum = parseInt(q, 10);
            if (pureNum && pureNum > 0 && /^\d+$/.test(q)) {
              epListContainer.replaceChildren(
                h('div', { class: 'ep-grid-empty' },
                  h('p', { text: 'No episodes match "' + epFilterInput.value + '"' }),
                  h('button', { class: 'btn btn--acc', style: 'margin-top:10px;min-height:36px;padding:0 14px;font-size:13px',
                    onclick: () => {

      });

  }

  /* ---------- Seasons & Specials row (no "Related" — accurate ordering) ---------- */
  const seasonsSec = h('section', { class: 'sec', hidden: true, 'data-aos': 'fade-up' }, h('h2', null, ic('tv'), 'Seasons & specials'));
  const seasonsRow = h('div', { class: 'hscroll season-row' });
  seasonsSec.append(seasonsRow);
  main.append(seasonsSec);

  /* Build seasons + specials using franchise resolution (root-walk) */
  let franchiseData = null;
  try {
    if (anime) franchiseData = await Franchise.fullFranchise(anime);
  } catch (e) { franchiseData = null; }

  const renderSeasonsRow = async () => {
    if (!anime) return;
    let seasons = [];
    let specials = [];
    if (franchiseData && franchiseData.watchOrder && franchiseData.watchOrder.length) {
      for (const r of franchiseData.watchOrder) {
        if (!r || !r.key) continue;
        const rel = String(r.relation || '').toLowerCase();
        const cat = categorizeFranchiseEntry(r, rel);
        if (cat === 'season') seasons.push({ entry: r, relation: rel });
        else specials.push({ entry: r, relation: rel });
      }
      seasons.forEach(s => { if (s.entry.key === anime.key) s.relation = 'self'; });
      specials.forEach(s => { if (s.entry.key === anime.key) s.relation = 'self'; });
    } else {
      /* Fallback: use direct relations */
      const det = anime;
      const relEntries = ((det && det.relations && det.relations.entries) || []);
      /* When we only have anime (not full details), fetch relations */
      let rels = (det && det.relations) || null;
      if (!rels) {
        try {
          const d2 = await API.get(animeUrl(anime.key), 10 * 60000);
          rels = d2.relations || null;
        } catch (e) { rels = null; }
      }
      if (rels) {
        const groups = rels.groups || {};
        const seen = new Set();
        ['prequel', 'sequel', 'parent'].forEach(gk => {
          for (const e of (groups[gk] || [])) {
            if (!e || !e.key || seen.has(e.key)) continue;
            seen.add(e.key);
            seasons.push({ entry: e, relation: gk });
          }
        });
        for (const e of (groups.sideStory || [])) {
          if (!e || !e.key || seen.has(e.key)) continue;
          seen.add(e.key);
          const cat = categorizeFranchiseEntry(e, 'sideStory');
          (cat === 'season' ? seasons : specials).push({ entry: e, relation: 'sideStory' });
        }
        ['alternative', 'spinOff', 'special', 'ova', 'ona', 'movie', 'summary', 'related', 'character', 'other'].forEach(gk => {
          for (const e of (groups[gk] || [])) {
            if (!e || !e.key || seen.has(e.key)) continue;
            seen.add(e.key);
            specials.push({ entry: e, relation: gk });
          }
        });
        for (const e of relEntries) {
          if (!e || !e.key || seen.has(e.key)) continue;
          seen.add(e.key);
          const t = (e.type || '').toUpperCase();
          if (t === 'TV') seasons.push({ entry: e, relation: 'related' });
          else specials.push({ entry: e, relation: 'related' });
        }
      }
    }
    /* Dedup */
    const seen = new Set();
    seasons = seasons.filter(s => { if (seen.has(s.entry.key)) return false; seen.add(s.entry.key); return true; });
    specials = specials.filter(s => { if (seen.has(s.entry.key)) return false; seen.add(s.entry.key); return true; });
    /* Sort by release order / year */
    const sortByRelease = list => list.sort((x, y) => {
      const rx = Number(x.entry.releaseOrder || x.entry.order || 0);
      const ry = Number(y.entry.releaseOrder || y.entry.order || 0);
      if (rx && ry && rx !== ry) return rx - ry;
      return (x.entry.year || 9999) - (y.entry.year || 9999);
    });
    sortByRelease(seasons);
    sortByRelease(specials);
    /* Render seasons first, then specials (both in same row, seasons precede) */
    const all = seasons.concat(specials);
    if (all.length) {
      seasonsRow.replaceChildren(...all.map(({ entry, relation }) =>
        animeCard(entry, { relBadge: relation === 'self' ? 'You are here' : (GROUP_LABEL[relation] || relation) })
      ));
      seasonsSec.hidden = false;
    }
  };

  await renderSeasonsRow();

  /* ---------- Recommendations row ---------- */
  const recSec = h('section', { class: 'sec', hidden: true, 'data-aos': 'fade-up' }, h('h2', null, ic('heart-list'), 'Recommendations'));
  const recRow = h('div', { class: 'hscroll' });
  recSec.append(recRow);
  main.append(recSec);

  API.get('/api/meta/recommendations?key=' + enc(key) + '&limit=12', 30 * 60000).then(j => {
    if (my !== Router.seq) return;
    const recs = (j.recommendations || []).filter(r => r && r.key);
    if (!recs.length) return;
    recRow.replaceChildren(...recs.map(r => animeCard(r)));
    recSec.hidden = false;
    if (window.AOS) AOS.refresh();
  }).catch(() => { });

  entryPromise.then(entry => {
    if (!entry || my !== Router.seq) return;
    renderServers(entry);
  }).catch(() => { });
  document.title = (uiState.title ? uiState.title + ' \u00b7 EP ' + ep + ' \u00b7 ' : '') + 'AniKuoshi';
  if (window.AOS) AOS.refresh();
};

/* v1.0.4: Global '/' keyboard shortcut to focus the search input from any page.
   Pressing '/' (when not already typing in an input) finds the nearest search
   input on the page and focuses it. Press Esc to blur.                     */
window.addEventListener('keydown', (e) => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  /* Don't intercept if a modal is open */
  const modalOpen = document.querySelector('.modal.open') || document.querySelector('.bm-pop');
  if (modalOpen) return;
  const input = document.querySelector('.searchbar input, input[type="search"]');
  if (input) {
    e.preventDefault();
    input.focus();
    if (input.select) input.select();
  }
});

/* ================= boot ================= */
/* ---------- Input modality tracker ----------
   Browsers heuristically apply :focus-visible to tabindex=0 elements on
   mouse click (treating them as "non-natively-focusable, maybe keyboard").
   To guarantee NO focus ring appears on mouse/touch input, we toggle a
   `no-focus-ring` class on <html> whenever the last input was a pointer
   event, and remove it ONLY when the user presses Tab (real keyboard
   navigation). Other keys (N/P/Space/J/L shortcuts, typing in inputs,
   arrow keys in dropdowns, etc.) must NOT remove it — otherwise the ring
   appears on the element that still has focus from the last click.       */
(function () {
  const html = document.documentElement;
  let lastWasPointer = false;
  const markPointer = () => {
    if (!lastWasPointer) { html.classList.add('no-focus-ring'); lastWasPointer = true; }
  };
  const markKeyboard = (e) => {
    /* ONLY Tab (with or without Shift) restores the focus ring.
       Everything else — N/P/Space/J/L player shortcuts, arrow keys,
       Enter/Space activation, typing in inputs — leaves the ring state
       alone so it doesn't pop up on the still-focused element.             */
    if (e.key !== 'Tab') return;
    if (lastWasPointer) { html.classList.remove('no-focus-ring'); lastWasPointer = false; }
  };
  /* pointerdown covers mouse, touch, and pen. mousedown/touchstart are
     fallbacks for browsers that don't fire pointerdown in some edge cases. */
  window.addEventListener('pointerdown', markPointer, true);
  window.addEventListener('mousedown', markPointer, true);
  window.addEventListener('touchstart', markPointer, { passive: true, capture: true });
  window.addEventListener('keydown', markKeyboard, true);
  /* Start in "no-focus-ring" mode since the page just loaded via mouse
     navigation in the vast majority of cases. The first Tab key will
     restore the ring.                                                       */
  html.classList.add('no-focus-ring');
})();
window.addEventListener('offline', () => toast('You are offline \u2014 cached pages still work'));
window.addEventListener('online', () => toast('Back online'));
applyTheme();           /* apply saved accent + title-lang before first paint */
Changelog.init();
Settings.init();
ConfirmDialog.init();   /* v1.0.2: custom confirm dialog */
if (window.AOS) {
  AOS.init({
    duration: 600,
    easing: 'ease-out-cubic',
    once: true,
    offset: 30,
    delay: 0
  });
}
Router.start();
